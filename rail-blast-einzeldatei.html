<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAIL BLAST</title>
<!-- Erzeugt von build-einzeldatei.py. Nicht direkt bearbeiten -
     Aenderungen gehoeren in index.html, css/style.css und js/main.js. -->
<style>
/* ===================================================================
   RAIL BLAST - Startbildschirm
   Aufbau: #app > #camera (Screenshake) > #world (Parallaxe) > .layer
   Alle Ebenen sind absolut positioniert und leicht übergroß, damit beim
   Parallax-Versatz keine Ränder ins Bild laufen.
   =================================================================== */

:root {
  /* Himmel */
  --sky-0: #04070e;
  --sky-1: #0a1425;
  --sky-2: #16304f;
  --sky-3: #2d5570;
  --sky-4: #5e7a80;

  /* Landschaft */
  --ridge-far: #16283c;
  --ridge-mid: #12202c;
  --tree:      #0a141b;
  --ground-0:  #2c3427;
  --ground-1:  #161c14;

  /* Metall und Licht */
  --rail:      #9aa7b4;
  --rail-dark: #4a545f;
  --sleeper:   #4a3526;
  --amber:     #ffb23f;
  --amber-hot: #ffd98a;
  --ember:     #ff6a1a;

  /* UI */
  --ink:       #eaf1f8;
  --ink-dim:   rgba(234, 241, 248, .58);
  --panel-bg:  rgba(10, 16, 24, .92);

  /* Höhenlinien der Szene, überall referenziert */
  --horizon:   32%;   /* Oberkante des Bodens */
  --track-y:   17%;   /* Unterkante des Gleises */

  --ui-font: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --title-font: "Arial Black", "Segoe UI Black", "Helvetica Neue", Impact, var(--ui-font);
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
  background: #04070e;
}

body {
  font-family: var(--ui-font);
  color: var(--ink);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#artdefs { position: absolute; width: 0; height: 0; overflow: hidden; }

#app {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

#camera {
  position: absolute;
  inset: 0;
  will-change: transform;
}

#world {
  position: absolute;
  inset: 0;
}

/* Ebenen ragen über den Rand hinaus, damit die Parallaxe keine Lücke zeigt */
.layer {
  position: absolute;
  left: -4%;
  right: -4%;
  width: 108%;
  will-change: transform;
}


/* ============================ Himmel ============================ */

.sky {
  top: 0;
  bottom: 0;
  background:
    radial-gradient(120% 62% at 50% 100%, rgba(255, 150, 60, .16) 0%, rgba(255, 150, 60, 0) 62%),
    linear-gradient(
      var(--sky-0) 0%,
      var(--sky-1) 26%,
      var(--sky-2) 50%,
      var(--sky-3) 64%,
      var(--sky-4) 72%
    );
}

/* Sterne und Sternschnuppen */
#skyfx {
  top: 0;
  width: 108%;      /* explizit, siehe Hinweis bei #fx */
  height: 74%;
  pointer-events: none;
}

/* Warmes Band direkt über dem Horizont */
.glowband {
  bottom: var(--horizon);
  height: 26%;
  background: linear-gradient(
    rgba(255, 168, 82, 0) 0%,
    rgba(255, 154, 66, .14) 55%,
    rgba(255, 196, 120, .34) 100%);
  pointer-events: none;
}

.moon {
  top: 9%;
  left: 0;
  right: auto;
  width: 132px;
  height: 132px;
  border-radius: 50%;
  margin-left: 74%;
  background:
    radial-gradient(circle at 62% 30%, rgba(0,0,0,.10) 0 9px, transparent 10px),
    radial-gradient(circle at 38% 58%, rgba(0,0,0,.12) 0 13px, transparent 14px),
    radial-gradient(circle at 66% 68%, rgba(0,0,0,.09) 0 7px, transparent 8px),
    radial-gradient(circle at 40% 36%, #fffdf4 0%, #f2ead6 58%, #cfc3a6 100%);
  box-shadow:
    0 0 40px 12px rgba(226, 232, 240, .22),
    0 0 130px 50px rgba(150, 190, 255, .14);
}


/* ========================== Landschaft ========================== */

.ridge {
  bottom: var(--horizon);
  height: 32%;
  display: block;
}
.ridge-far path { fill: var(--ridge-far); }
.ridge-mid path { fill: var(--ridge-mid); }

/* Dunstschleier zwischen den Bergketten - erzeugt Tiefe */
.haze {
  height: 15%;
  pointer-events: none;
}
.haze-far {
  bottom: calc(var(--horizon) + 2%);
  background: linear-gradient(rgba(120, 160, 190, 0), rgba(126, 166, 196, .17));
}
.haze-mid {
  bottom: var(--horizon);
  height: 11%;
  background: linear-gradient(rgba(110, 145, 175, 0), rgba(120, 155, 180, .15));
}

.treeline {
  bottom: calc(var(--horizon) - 1%);
  height: 15%;
  display: block;
}
.treeline path { fill: var(--tree); }

/* Telegrafenmasten */
.poles {
  bottom: var(--horizon);
  height: 20%;
}
.poles i {
  position: absolute;
  bottom: 0;
  width: 3px;
  background: #0a1116;
}
.poles i::before,
.poles i::after {
  content: "";
  position: absolute;
  left: -9px;
  width: 21px;
  height: 2px;
  background: #0a1116;
}
.poles i::before { top: 9%; }
.poles i::after  { top: 19%; }

/* Boden / Schotterbett */
.ground {
  bottom: 0;
  height: var(--horizon);
  background:
    radial-gradient(circle at 12% 34%, rgba(255,255,255,.05) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 38% 66%, rgba(255,255,255,.045) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 66% 28%, rgba(255,255,255,.05) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 87% 58%, rgba(255,255,255,.04) 0 1.5px, transparent 2.5px),
    linear-gradient(rgba(12, 18, 24, .92) 0%, rgba(12, 18, 24, 0) 11%),
    linear-gradient(rgba(255, 178, 63, .09), rgba(255, 178, 63, 0) 22%),
    linear-gradient(#232a1f 0%, #171d15 34%, #0d1109 100%);
  background-size: 90px 100%, 130px 100%, 110px 100%, 150px 100%,
                   100% 100%, 100% 100%, 100% 100%;
}

.grass {
  bottom: 0;
  height: 12%;
  display: block;
}
.grass path { fill: #0d1310; }


/* ============================ Gleis ============================= */

.track {
  bottom: var(--track-y);
  height: 34px;
}

.sleepers {
  position: absolute;
  left: 0;
  right: 0;
  top: 8px;
  height: 22px;
  background-image: repeating-linear-gradient(
    to right,
    var(--sleeper) 0 18px,
    #241a12 18px 20px,
    transparent 20px 46px);
}

.rail {
  position: absolute;
  left: 0;
  right: 0;
  height: 6px;
  background: linear-gradient(#d8dee5, var(--rail) 42%, var(--rail-dark));
}
.rail.far  { top: 4px; opacity: .85; }
.rail.near { top: 18px; z-index: 6; box-shadow: 0 2px 5px rgba(0,0,0,.55); overflow: hidden; }

/* Wandernder Glanz auf der vorderen Schiene */
.rail .shine {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 22%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent);
  animation: railshine 9s linear infinite;
}
@keyframes railshine {
  0%   { transform: translateX(-30vw); }
  100% { transform: translateX(120vw); }
}


/* ======================= Zug und Beleuchtung ==================== */

/* Traegt nur die Parallaxe; Position und Groesse des Zuges macht #trainWrap */
#trainLayer {
  top: 0;
  bottom: 0;
  z-index: 4;
}

#trainWrap {
  position: absolute;
  bottom: calc(var(--track-y) + 13px);
  left: 50%;
  transform: translateX(-50%) scale(1);
  transform-origin: bottom center;
  z-index: 4;
  will-change: transform;
}

#train {
  display: flex;
  align-items: flex-end;
  gap: 4px;
  filter: drop-shadow(0 12px 14px rgba(0, 0, 0, .55));
}

.part { position: relative; will-change: transform, opacity; }
.part svg { display: block; }

/* Lampe und Fenster atmen leicht */
.lamp      { animation: lampFlicker 4.2s ease-in-out infinite; transform-origin: center; }
.firelight { animation: fireFlicker 2.6s ease-in-out infinite; transform-origin: center; }

@keyframes lampFlicker {
  0%, 100% { opacity: 1; }
  47%      { opacity: .86; }
  52%      { opacity: 1; }
  78%      { opacity: .92; }
}
@keyframes fireFlicker {
  0%, 100% { opacity: .18; }
  30%      { opacity: .3; }
  55%      { opacity: .14; }
  80%      { opacity: .26; }
}

/* Lichtkegel des Spitzenlichts, läuft nach vorn übers Gleis */
#beam {
  position: absolute;
  right: 100%;          /* endet an der Lokfront */
  bottom: 4px;
  width: 620px;
  height: 118px;
  z-index: 3;
  background: linear-gradient(
    to left,
    rgba(255, 214, 140, .30) 0%,
    rgba(255, 200, 120, .13) 34%,
    rgba(255, 190, 110, 0) 78%);
  clip-path: polygon(100% 32%, 100% 70%, 0% 100%, 0% 0%);
  filter: blur(7px);
  pointer-events: none;
  animation: beamFlicker 5s ease-in-out infinite;
}
@keyframes beamFlicker {
  0%, 100% { opacity: .95; }
  40%      { opacity: .78; }
  62%      { opacity: 1; }
}

/* Dampfwölkchen über dem Schornstein */
.steam {
  position: absolute;
  left: 38px;
  top: -8px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%,
    rgba(255,255,255,.8), rgba(214,226,238,.32) 55%, rgba(214,226,238,0) 72%);
  animation: puff 2.8s linear infinite;
}
.steam:nth-of-type(2) { animation-delay: .95s; }
.steam:nth-of-type(3) { animation-delay: 1.9s; }

@keyframes puff {
  0%   { transform: translate(0,0) scale(.35); opacity: .75; }
  100% { transform: translate(-58px,-105px) scale(2.9); opacity: 0; }
}

/* Vibrieren kurz vor der Explosion */
@keyframes rumble {
  0%, 100% { transform: translate(0,0) rotate(0deg); }
  20% { transform: translate(-2px, 1px) rotate(-.45deg); }
  40% { transform: translate( 2px,-1px) rotate( .45deg); }
  60% { transform: translate(-3px,-1px) rotate(-.3deg); }
  80% { transform: translate( 3px, 1px) rotate( .3deg); }
}
#train.rumbling { animation: rumble .085s linear infinite; }


/* ========================== Bildlook ============================ */

/* canvas ist ein ersetztes Element: ohne explizite Groesse gewinnt die
   intrinsische 300x150, inset:0 allein dehnt es nicht. */
#fx {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 10;
  pointer-events: none;
}

/* Feuerschein legt sich während der Explosion über die ganze Szene */
/* Liegt in #camera zwischen Landschaft und Partikeln: beleuchtet die Szene,
   überstrahlt aber nicht mehr den Feuerball. */
#firelight {
  position: absolute;
  inset: 0;
  z-index: 8;
  opacity: 0;
  mix-blend-mode: screen;
  pointer-events: none;
  /* Position setzt das Skript auf die Explosionsstelle */
  background: radial-gradient(64% 54% at var(--fx-x, 50%) var(--fx-y, 68%),
    rgba(255, 146, 48, .58) 0%, rgba(255, 88, 18, .26) 40%, rgba(255, 60, 10, 0) 74%);
}

#vignette {
  position: absolute;
  inset: 0;
  z-index: 13;
  pointer-events: none;
  background:
    radial-gradient(128% 96% at 50% 46%, rgba(0,0,0,0) 46%, rgba(0,0,0,.55) 100%),
    linear-gradient(rgba(6, 12, 22, .34), rgba(6, 12, 22, 0) 22%);
}

#flash {
  position: absolute;
  inset: 0;
  z-index: 14;
  background: #fff;
  opacity: 0;
  pointer-events: none;
}


/* ============================= Menü ============================= */

#ui {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 5vh 4vw 4vh;
  pointer-events: none;
}
#ui > * { pointer-events: auto; }

.brand { text-align: center; }

.title {
  margin: 0;
  font-family: var(--title-font);
  font-weight: 900;
  font-size: clamp(42px, 9.5vw, 132px);
  line-height: .92;
  letter-spacing: .02em;
  display: flex;
  gap: .18em;
  justify-content: center;
}

.title span {
  display: block;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
  filter: drop-shadow(0 4px 0 rgba(0,0,0,.55)) drop-shadow(0 14px 26px rgba(0,0,0,.6));
}

/* Gebürstetes Metall */
.title .t1 {
  background-image: linear-gradient(
    #ffffff 0%, #c8d6e2 26%, #7c8fa1 50%, #dfe9f2 62%, #8fa2b3 82%, #5d6c7a 100%);
}

/* Glühendes Bernstein */
.title .t2 {
  background-image: linear-gradient(
    #fff4d0 0%, #ffd071 24%, #ff9420 52%, #ffc061 70%, #e9720d 100%);
  animation: titleHeat 4.4s ease-in-out infinite;
}
@keyframes titleHeat {
  0%, 100% { filter: drop-shadow(0 4px 0 rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(255,140,30,.5)); }
  50%      { filter: drop-shadow(0 4px 0 rgba(0,0,0,.55)) drop-shadow(0 0 34px rgba(255,160,50,.85)); }
}

.tagline {
  margin: 14px 0 0;
  font-size: clamp(11px, 1.35vw, 15px);
  letter-spacing: .34em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

.menu {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

/* --- Buttons: abgeschrägte Ecken, Glanzkante, Glühen --- */
.btn {
  --btn-bg-1: rgba(24, 36, 50, .82);
  --btn-bg-2: rgba(12, 20, 30, .88);
  --btn-line: rgba(150, 190, 225, .5);
  --btn-ink:  var(--ink);

  position: relative;
  min-width: 260px;
  padding: 15px 42px;
  border: 0;
  font: inherit;
  font-weight: 700;
  font-size: 17px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--btn-ink);
  background: linear-gradient(var(--btn-bg-1), var(--btn-bg-2));
  clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
  cursor: pointer;
  transition: transform .13s ease, filter .13s ease, color .13s ease;
  backdrop-filter: blur(3px);
}

/* Rahmenlinie in gleicher Schrägform */
.btn::before {
  content: "";
  position: absolute;
  inset: 0;
  clip-path: polygon(
    14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px,
    14px 0,
    16px 2px, 2px 16px, 2px calc(100% - 2px), calc(100% - 16px) calc(100% - 2px),
    calc(100% - 2px) calc(100% - 16px), calc(100% - 2px) 2px, 16px 2px);
  background: var(--btn-line);
  pointer-events: none;
}

/* Glanz oben */
.btn::after {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 45%;
  background: linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,0));
  pointer-events: none;
}

.btn .lbl { position: relative; z-index: 1; }

.btn:hover,
.btn.sel {
  --btn-line: rgba(200, 228, 255, .95);
  transform: translateY(-2px);
  filter: drop-shadow(0 6px 18px rgba(120, 190, 255, .3));
}
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--amber-hot); outline-offset: 4px; }

/* Hauptbutton */
.btn.primary {
  --btn-bg-1: #ffcf62;
  --btn-bg-2: #e5820f;
  --btn-line: rgba(255, 232, 170, .85);
  --btn-ink:  #2a1403;
  font-size: 20px;
  padding: 18px 52px;
  min-width: 300px;
  animation: btnPulse 2.8s ease-in-out infinite;
}
@keyframes btnPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 178, 63, .42), 0 12px 30px rgba(0,0,0,.5); }
  55%      { box-shadow: 0 0 0 16px rgba(255, 178, 63, 0), 0 12px 30px rgba(0,0,0,.5); }
}
.btn.primary:hover,
.btn.primary.sel {
  --btn-bg-1: #ffe08c;
  --btn-bg-2: #ff9a1e;
  filter: drop-shadow(0 8px 26px rgba(255, 150, 40, .55));
}

/* Zustand nach der Explosion */
.btn.primary.done {
  --btn-bg-1: #7de9ff;
  --btn-bg-2: #1d8dc4;
  --btn-line: rgba(190, 245, 255, .9);
  --btn-ink:  #04212e;
  animation: none;
  text-transform: none;
  letter-spacing: .06em;
  box-shadow: 0 0 34px rgba(70, 200, 255, .45), 0 12px 30px rgba(0,0,0,.5);
}
.btn.primary.done:hover { transform: none; filter: none; }

.btn.small {
  min-width: 0;
  padding: 11px 26px;
  font-size: 14px;
  margin-top: 6px;
}

.hint {
  margin: 18px 0 0;
  min-height: 18px;
  font-size: 13px;
  letter-spacing: .12em;
  color: var(--ink-dim);
}

.version {
  position: absolute;
  right: 18px;
  bottom: 12px;
  margin: 0;
  font-size: 12px;
  letter-spacing: .18em;
  color: rgba(234, 241, 248, .3);
}


/* ============================ Panels ============================ */

.scrim {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  background: rgba(3, 7, 14, .68);
  backdrop-filter: blur(4px);
}
.scrim[hidden] { display: none; }

.panel {
  width: min(440px, 88vw);
  padding: 28px 30px 24px;
  background: var(--panel-bg);
  border: 1px solid rgba(150, 190, 225, .28);
  clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
  box-shadow: 0 30px 70px rgba(0,0,0,.6);
  text-align: center;
}
.panel[hidden] { display: none; }

.panel h2 {
  margin: 0 0 22px;
  font-family: var(--title-font);
  font-size: 26px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--amber);
}

.row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 14px;
  padding: 11px 0;
  border-top: 1px solid rgba(150, 190, 225, .14);
  text-align: left;
  font-size: 15px;
}
.row output {
  min-width: 38px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--amber);
}

.row input[type="range"] {
  width: 150px;
  accent-color: var(--amber);
}
.row input[type="checkbox"] {
  width: 20px;
  height: 20px;
  accent-color: var(--amber);
}
.row select {
  padding: 6px 10px;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  background: rgba(30, 44, 60, .9);
  border: 1px solid rgba(150, 190, 225, .35);
}

.keys {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 12px 18px;
  margin: 0 0 22px;
  text-align: left;
  font-size: 15px;
}
.keys dt { margin: 0; display: flex; gap: 5px; }
.keys dd { margin: 0; color: var(--ink-dim); align-self: center; }

kbd {
  display: inline-block;
  min-width: 30px;
  padding: 4px 8px;
  font: 600 12px/1 var(--ui-font);
  text-align: center;
  color: var(--ink);
  background: rgba(40, 56, 74, .95);
  border: 1px solid rgba(150, 190, 225, .35);
  border-bottom-width: 3px;
  border-radius: 4px;
}


/* ======================= Bildschirmaufteilung =================== */

/* Breite Fenster: Titel und Menü stehen links, der Zug rechts daneben -
   so verdeckt das Menü die Szene nicht. */
@media (min-width: 1000px) {
  #ui { align-items: flex-start; padding: 6vh 5vw 5vh; }
  .brand { text-align: left; }
  .title { justify-content: flex-start; }
  .menu  { align-items: flex-start; margin-bottom: 1vh; }
  .hint  { align-self: flex-start; }
  #trainWrap { left: 68%; }
}

@media (min-width: 1400px) {
  #trainWrap { left: 70%; transform: translateX(-50%) scale(1.12); }
}

/* Schmalere Fenster: alles zentriert. Dafür liegt das Gleis höher,
   damit unter dem Zug Platz für das Menü bleibt. */
@media (max-width: 999px) {
  :root { --horizon: 45%; --track-y: 32%; }
  .ridge { height: 30%; }
  .glowband { height: 22%; }
}


/* ========================== Kleine Bildschirme ================== */

@media (max-width: 760px) {
  #trainWrap { transform: translateX(-50%) scale(.62); }
  #beam { width: 380px; height: 80px; }
  /* tiefer und kleiner, sonst liegt er auf dem Titel */
  .moon { width: 88px; height: 88px; top: 15%; margin-left: 66%; }
  .btn { min-width: 220px; padding: 13px 30px; font-size: 15px; }
  .btn.primary { min-width: 250px; padding: 15px 36px; font-size: 17px; }
  .moon { width: 92px; height: 92px; }
}

@media (max-width: 520px) {
  #trainWrap { transform: translateX(-50%) scale(.52); }
  .tagline { letter-spacing: .16em; }
}

/* Sehr flache Fenster: Titel kleiner, damit das Menü Platz behält */
@media (max-height: 560px) {
  .title { font-size: clamp(32px, 7vw, 64px); }
  .tagline { margin-top: 8px; }
  #ui { padding-top: 3vh; }
}

@media (prefers-reduced-motion: reduce) {
  .steam, .rail .shine, .btn.primary, .title .t2, .lamp, .firelight, #beam {
    animation: none;
  }
}

</style>
</head>
<body>

<!-- ===================================================================
     Wiederverwendbare Bauteile und Farbverläufe der Zug-Illustration.
     Liegt einmal im Dokument, alle Fahrzeuge referenzieren es per <use>.
     =================================================================== -->
<svg id="artdefs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <!-- Kessel: enge Stops erzeugen die zylindrische Woelbung -->
    <linearGradient id="gBoiler" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#151d25"/>
      <stop offset="12%"  stop-color="#3f5668"/>
      <stop offset="28%"  stop-color="#7e94a8"/>
      <stop offset="40%"  stop-color="#5a6f83"/>
      <stop offset="62%"  stop-color="#33455a"/>
      <stop offset="84%"  stop-color="#1c2732"/>
      <stop offset="100%" stop-color="#0c1218"/>
    </linearGradient>
    <linearGradient id="gSmokebox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#141a20"/>
      <stop offset="26%"  stop-color="#3c4854"/>
      <stop offset="42%"  stop-color="#4c5a67"/>
      <stop offset="66%"  stop-color="#232c35"/>
      <stop offset="100%" stop-color="#0b1015"/>
    </linearGradient>
    <linearGradient id="gCab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6f3826"/>
      <stop offset="22%"  stop-color="#a15c45"/>
      <stop offset="46%"  stop-color="#8a4530"/>
      <stop offset="74%"  stop-color="#5a2415"/>
      <stop offset="100%" stop-color="#2f1109"/>
    </linearGradient>
    <linearGradient id="gRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#57302a"/>
      <stop offset="55%"  stop-color="#3a1d16"/>
      <stop offset="100%" stop-color="#1d0d08"/>
    </linearGradient>
    <linearGradient id="gRoof2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3c5347"/>
      <stop offset="55%"  stop-color="#25342b"/>
      <stop offset="100%" stop-color="#121c16"/>
    </linearGradient>
    <linearGradient id="gCoach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#22523c"/>
      <stop offset="22%"  stop-color="#3f8760"/>
      <stop offset="46%"  stop-color="#2d6647"/>
      <stop offset="74%"  stop-color="#1a4030"/>
      <stop offset="100%" stop-color="#0b1d15"/>
    </linearGradient>
    <linearGradient id="gFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3b4854"/>
      <stop offset="30%"  stop-color="#252e37"/>
      <stop offset="100%" stop-color="#10161c"/>
    </linearGradient>
    <linearGradient id="gCylinder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#46535f"/>
      <stop offset="34%"  stop-color="#2c3641"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="gPilot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a45340"/>
      <stop offset="50%"  stop-color="#7c3927"/>
      <stop offset="100%" stop-color="#43180f"/>
    </linearGradient>
    <linearGradient id="gCoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#464650"/>
      <stop offset="100%" stop-color="#0d0d10"/>
    </linearGradient>
    <linearGradient id="gWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff6d6"/>
      <stop offset="100%" stop-color="#e9b249"/>
    </linearGradient>
    <linearGradient id="gSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c3d0dc"/>
      <stop offset="45%"  stop-color="#7c8a98"/>
      <stop offset="100%" stop-color="#39434d"/>
    </linearGradient>
    <!-- Radreifen: oben Mondlicht, unten im Schatten -->
    <linearGradient id="gTyre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#cfdbe6"/>
      <stop offset="40%"  stop-color="#7b8998"/>
      <stop offset="100%" stop-color="#2f3841"/>
    </linearGradient>
    <!-- Legt sich ueber das Rad und gibt ihm Woelbung -->
    <radialGradient id="gWheelShade" cx="36%" cy="28%" r="78%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="52%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".48"/>
    </radialGradient>
    <radialGradient id="gLamp" cx="40%" cy="34%" r="66%">
      <stop offset="0%"   stop-color="#fffdf0"/>
      <stop offset="45%"  stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#cf8c12"/>
    </radialGradient>

    <!-- Weiches Glühen für Lampe und Fenster -->
    <filter id="fGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Treibrad: Speichen, Nabe, Gegengewicht -->
    <g id="wheelBig">
      <circle r="30" fill="#04080c"/>
      <circle r="28" fill="#161e26"/>
      <circle r="28" fill="none" stroke="url(#gTyre)" stroke-width="4.5"/>
      <circle r="22.5" fill="#232d38"/>
      <g stroke="#5b6977" stroke-width="4.4" stroke-linecap="round">
        <line y1="-20.5" y2="20.5"/>
        <line y1="-20.5" y2="20.5" transform="rotate(30)"/>
        <line y1="-20.5" y2="20.5" transform="rotate(60)"/>
        <line y1="-20.5" y2="20.5" transform="rotate(90)"/>
        <line y1="-20.5" y2="20.5" transform="rotate(120)"/>
        <line y1="-20.5" y2="20.5" transform="rotate(150)"/>
      </g>
      <g stroke="#93a5b6" stroke-width="1.3" stroke-linecap="round" opacity=".5"
         transform="translate(-1.1,-1.1)">
        <line y1="-19" y2="19"/>
        <line y1="-19" y2="19" transform="rotate(30)"/>
        <line y1="-19" y2="19" transform="rotate(60)"/>
        <line y1="-19" y2="19" transform="rotate(90)"/>
        <line y1="-19" y2="19" transform="rotate(120)"/>
        <line y1="-19" y2="19" transform="rotate(150)"/>
      </g>
      <path d="M17.6 12.3 A21.5 21.5 0 0 1 -17.6 12.3 L-8.2 5.7 A10 10 0 0 0 8.2 5.7 Z" fill="#3b4653"/>
      <circle r="8.5" fill="#3b4653" stroke="#04080c" stroke-width="2"/>
      <circle cx="-2" cy="-2" r="3.2" fill="#aebcc9" opacity=".8"/>
      <circle r="28" fill="url(#gWheelShade)"/>
    </g>

    <!-- Laufrad -->
    <g id="wheelSmall">
      <circle r="16.5" fill="#04080c"/>
      <circle r="15" fill="#161e26"/>
      <circle r="15" fill="none" stroke="url(#gTyre)" stroke-width="3.4"/>
      <circle r="10.5" fill="#232d38"/>
      <g stroke="#5b6977" stroke-width="3.2" stroke-linecap="round">
        <line y1="-9" y2="9"/>
        <line y1="-9" y2="9" transform="rotate(45)"/>
        <line y1="-9" y2="9" transform="rotate(90)"/>
        <line y1="-9" y2="9" transform="rotate(135)"/>
      </g>
      <circle r="4.4" fill="#3b4653" stroke="#04080c" stroke-width="1.6"/>
      <circle cx="-1.2" cy="-1.2" r="1.6" fill="#aebcc9" opacity=".75"/>
      <circle r="15" fill="url(#gWheelShade)"/>
    </g>
  </defs>
</svg>


<div id="app">

  <!-- #camera bekommt den Screenshake, #world die Parallaxe -->
  <div id="camera">
    <div id="world">

      <div class="layer sky"       data-depth="0"></div>
      <canvas class="layer" id="skyfx" data-depth="2"></canvas>
      <div class="layer moon"      data-depth="3"></div>
      <div class="layer glowband"  data-depth="2"></div>

      <!-- Ferne Bergkette -->
      <svg class="layer ridge ridge-far" data-depth="6" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 300 V190 L74 118 L128 163 L206 84 L272 148 L338 104 L418 172 L498 116
                 L556 168 L640 96 L716 158 L788 126 L860 176 L938 110 L1016 164 L1098 130
                 L1200 172 V300 Z"/>
      </svg>
      <div class="layer haze haze-far" data-depth="7"></div>

      <!-- Mittlere Hügelkette -->
      <svg class="layer ridge ridge-mid" data-depth="11" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 300 V228 Q96 186 196 220 Q296 254 398 208 Q516 158 618 212
                 Q722 262 822 214 Q922 170 1024 218 Q1124 258 1200 222 V300 Z"/>
      </svg>
      <div class="layer haze haze-mid" data-depth="13"></div>

        <path id="treePath"/>
      </svg>

      <!-- Telegrafenmasten, per JS erzeugt -->
      <div class="layer poles" data-depth="22" id="poles"></div>

      <div class="layer ground" data-depth="26"></div>

      <!-- Gleis über die ganze Bildbreite -->
      <div class="layer track" data-depth="30">
        <div class="rail far"></div>
        <div class="sleepers"></div>
        <div class="rail near"><i class="shine"></i></div>
      </div>

      <!-- Eigene Ebene mit derselben Tiefe wie das Gleis, damit der Zug
           beim Parallax-Versatz auf der Schiene stehen bleibt. -->
      <div class="layer" id="trainLayer" data-depth="30">
      <div id="trainWrap">
        <!-- Lichtkegel des Spitzenlichts, sitzt vor der Lok -->
        <div id="beam"></div>
        <div id="train">

        <!-- ===================== Dampflokomotive ===================== -->

            <g fill="#9db0c1" opacity=".42"><circle cx="66.0" cy="33.5" r="1.15"/><circle cx="75.3" cy="33.5" r="1.15"/><circle cx="84.7" cy="33.5" r="1.15"/><circle cx="94.0" cy="33.5" r="1.15"/><circle cx="103.3" cy="33.5" r="1.15"/><circle cx="112.7" cy="33.5" r="1.15"/><circle cx="122.0" cy="33.5" r="1.15"/><circle cx="131.3" cy="33.5" r="1.15"/><circle cx="140.7" cy="33.5" r="1.15"/><circle cx="150.0" cy="33.5" r="1.15"/><circle cx="159.3" cy="33.5" r="1.15"/><circle cx="168.7" cy="33.5" r="1.15"/><circle cx="178.0" cy="33.5" r="1.15"/></g>
            <g fill="#9db0c1" opacity=".42"><circle cx="66.0" cy="84.5" r="1.15"/><circle cx="75.3" cy="84.5" r="1.15"/><circle cx="84.7" cy="84.5" r="1.15"/><circle cx="94.0" cy="84.5" r="1.15"/><circle cx="103.3" cy="84.5" r="1.15"/><circle cx="112.7" cy="84.5" r="1.15"/><circle cx="122.0" cy="84.5" r="1.15"/><circle cx="131.3" cy="84.5" r="1.15"/><circle cx="140.7" cy="84.5" r="1.15"/><circle cx="150.0" cy="84.5" r="1.15"/><circle cx="159.3" cy="84.5" r="1.15"/><circle cx="168.7" cy="84.5" r="1.15"/><circle cx="178.0" cy="84.5" r="1.15"/></g>

            <g fill="#9db0c1" opacity=".42"><circle cx="184.0" cy="29.5" r="1.15"/><circle cx="194.0" cy="29.5" r="1.15"/><circle cx="204.0" cy="29.5" r="1.15"/><circle cx="214.0" cy="29.5" r="1.15"/><circle cx="224.0" cy="29.5" r="1.15"/><circle cx="234.0" cy="29.5" r="1.15"/><circle cx="244.0" cy="29.5" r="1.15"/><circle cx="254.0" cy="29.5" r="1.15"/></g>

        <!-- ========================= Tender ========================= -->

          <svg viewBox="0 0 130 150" width="130" height="150" aria-hidden="true">

            <rect x="0" y="102" width="16" height="10" rx="2" fill="#1b232b" stroke="#04080c" stroke-width="3"/>

            <use href="#wheelSmall" x="34" y="133.5"/>
            <use href="#wheelSmall" x="96" y="133.5"/>

            <!-- Durchgang 1: gemeinsame Silhouette (traegt die Aussenkontur) -->
            <g fill="#04080c" stroke="#04080c" stroke-width="6" stroke-linejoin="round">
              <rect x="6" y="100" width="118" height="17" rx="3"/>
              <rect x="10" y="56" width="110" height="46" rx="4"/>
              <path d="M14 56 L23 44 L35 49 L47 37 L61 44 L75 35 L89 46 L101 42 L116 56 Z"/>

<script>
/* ===================================================================
   RAIL BLAST - Startbildschirm
   Kein Build, keine Abhängigkeiten. Einfach index.html öffnen.

   Aufbau dieser Datei:
     1. Hilfsfunktionen und Einstellungen
     2. Audio (alles zur Laufzeit synthetisiert, keine Sounddateien)
     3. Szenendeko: Sterne, Bäume, Gras, Masten
     4. Parallaxe und Screenshake
     5. Partikelsystem
     6. Explosionssequenz
     7. Menü und Tastatursteuerung
   =================================================================== */
(function () {
  "use strict";

  /* ============ 1. Hilfsfunktionen und Einstellungen ============ */

  const $  = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  const rand  = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  const app       = $("#app");
  const camera    = $("#camera");
  const world     = $("#world");
  const trainWrap = $("#trainWrap");
  const train     = $("#train");
  const beam      = $("#beam");
  const fx        = $("#fx");
  const skyfx     = $("#skyfx");
  const flash     = $("#flash");
  const firelight = $("#firelight");
  const startBtn  = $("#startBtn");
  const hint      = $("#hint");

  const ctx   = fx.getContext("2d");
  const sctx  = skyfx.getContext("2d");

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* Einstellungen werden im Browser gespeichert */
  const DEFAULTS = { volume: 80, shake: true, quality: 1 };
  let settings = Object.assign({}, DEFAULTS);

  try {
    const saved = JSON.parse(localStorage.getItem("railblast.settings") || "null");
    if (saved) settings = Object.assign(settings, saved);
  } catch (e) { /* kaputter oder gesperrter Speicher: Standardwerte behalten */ }

  function saveSettings() {
    try { localStorage.setItem("railblast.settings", JSON.stringify(settings)); }
    catch (e) { /* Speichern ist optional */ }
  }

  /* Alles skaliert mit der Fensterbreite, damit die Explosion auf dem
     Handy nicht das halbe Display ausfüllt. */
  function sceneScale() {
    return clamp(app.clientWidth / 1100, 0.45, 1) * settings.quality;
  }

  /* Höhe der Schienenoberkante in Pixeln - dort landen Trümmer */
  function groundY() {
    const t = $(".track").getBoundingClientRect();
    const a = app.getBoundingClientRect();
    return t.top - a.top + 24;
  }


  /* ========================== 2. Audio ========================== */

  let ac = null, master = null, reverb = null;

  function audio() {
    if (ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();

    master = ac.createGain();
    master.gain.value = settings.volume / 100;
    master.connect(ac.destination);

    /* Synthetischer Nachhall: exponentiell abfallendes Rauschen als
       Impulsantwort. Gibt dem Knall Raum, ohne externe Datei. */
    const len = Math.floor(ac.sampleRate * 2.6);
    const ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
      }
    }
    reverb = ac.createConvolver();
    reverb.buffer = ir;
    const wet = ac.createGain();
    wet.gain.value = 0.5;
    reverb.connect(wet).connect(master);

    return ac;
  }

  function resume() {
    const a = audio();
    if (a && a.state === "suspended") a.resume();
    return a;
  }

  function setVolume(v) {
    settings.volume = v;
    if (master) master.gain.setTargetAtTime(v / 100, ac.currentTime, 0.02);
  }

  /* Rauschpuffer mit einstellbarer Abklingkurve */
  function noiseBuffer(dur, curve) {
    const n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, curve);
    }
    return buf;
  }

  function uiTick() {
    const a = resume(); if (!a) return;
    const t = a.currentTime;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(1250, t);
    o.frequency.exponentialRampToValueAtTime(760, t + 0.05);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.07, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
    o.connect(g).connect(master);
    o.start(t); o.stop(t + 0.1);
  }

  function uiConfirm() {
    const a = resume(); if (!a) return;
    const t = a.currentTime;
    [660, 990].forEach(function (f, i) {
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = "square";
      o.frequency.setValueAtTime(f, t + i * 0.07);
      g.gain.setValueAtTime(0.0001, t + i * 0.07);
      g.gain.exponentialRampToValueAtTime(0.06, t + i * 0.07 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.07 + 0.16);
      o.connect(g).connect(master);
      o.start(t + i * 0.07); o.stop(t + i * 0.07 + 0.18);
    });
  }

  /* Dampfpfeife: zwei leicht verstimmte Töne mit Vibrato */
  function playWhistle(dur) {
    const a = resume(); if (!a) return;
    const t = a.currentTime;
    const out = a.createGain();
    out.gain.setValueAtTime(0.0001, t);
    out.gain.exponentialRampToValueAtTime(0.16, t + 0.12);
    out.gain.setValueAtTime(0.16, t + dur - 0.14);
    out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    out.connect(master);
    out.connect(reverb);

    const vib = a.createOscillator();
    const vibGain = a.createGain();
    vib.frequency.value = 5.5;
    vibGain.gain.value = 7;
    vib.connect(vibGain);
    vib.start(t); vib.stop(t + dur);

    [523, 785, 1046].forEach(function (f, i) {
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = "sawtooth";
      o.frequency.setValueAtTime(f * 0.97, t);
      o.frequency.linearRampToValueAtTime(f, t + 0.3);
      vibGain.connect(o.frequency);
      g.gain.value = [0.5, 0.32, 0.14][i];
      o.connect(g).connect(out);
      o.start(t); o.stop(t + dur);
    });

    /* Zischen der Dampfpfeife */
    const hiss = a.createBufferSource();
    hiss.buffer = noiseBuffer(dur, 0.4);
    const hp = a.createBiquadFilter();
    hp.type = "highpass";
    hp.frequency.value = 2600;
    const hg = a.createGain();
    hg.gain.value = 0.05;
    hiss.connect(hp).connect(hg).connect(out);
    hiss.start(t); hiss.stop(t + dur);
  }

  /* Dumpfer Vorknall */
  function playThud() {
    const a = resume(); if (!a) return;
    const t = a.currentTime;

    const o = a.createOscillator();
    const g = a.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(90, t);
    o.frequency.exponentialRampToValueAtTime(32, t + 0.35);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(g).connect(master);
    o.connect(g).connect(reverb);
    o.start(t); o.stop(t + 0.52);

    const n = a.createBufferSource();
    n.buffer = noiseBuffer(0.4, 2.5);
    const lp = a.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.value = 700;
    const ng = a.createGain();
    ng.gain.value = 0.3;
    n.connect(lp).connect(ng).connect(master);
    n.start(t); n.stop(t + 0.4);
  }

  /* Der Hauptknall: Druckwelle, Sub-Bass, berstendes Metall, Nachhall */
  function playBlast() {
    const a = resume(); if (!a) return;
    const t = a.currentTime;

    /* Schicht 1: heller Knall */
    const crackN = a.createBufferSource();
    crackN.buffer = noiseBuffer(1.2, 3.2);
    const bp = a.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.setValueAtTime(2600, t);
    bp.frequency.exponentialRampToValueAtTime(420, t + 0.5);
    bp.Q.value = 0.7;
    const cg = a.createGain();
    cg.gain.value = 0.75;
    crackN.connect(bp).connect(cg);
    cg.connect(master); cg.connect(reverb);
    crackN.start(t); crackN.stop(t + 1.2);

    /* Schicht 2: dunkles Grollen mit langem Ausklang */
    const rumbleN = a.createBufferSource();
    rumbleN.buffer = noiseBuffer(3.4, 1.8);
    const lp = a.createBiquadFilter();
    lp.type = "lowpass";
    lp.frequency.setValueAtTime(1500, t);
    lp.frequency.exponentialRampToValueAtTime(90, t + 2.6);
    const rg = a.createGain();
    rg.gain.setValueAtTime(0.0001, t);
    rg.gain.exponentialRampToValueAtTime(0.9, t + 0.02);
    rg.gain.exponentialRampToValueAtTime(0.0001, t + 3.4);
    rumbleN.connect(lp).connect(rg);
    rg.connect(master); rg.connect(reverb);
    rumbleN.start(t); rumbleN.stop(t + 3.4);

    /* Schicht 3: Sub-Bass-Wumms */
    const sub = a.createOscillator();
    const sg = a.createGain();
    sub.type = "sine";
    sub.frequency.setValueAtTime(165, t);
    sub.frequency.exponentialRampToValueAtTime(21, t + 1.1);
    sg.gain.setValueAtTime(0.0001, t);
    sg.gain.exponentialRampToValueAtTime(1.0, t + 0.02);
    sg.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    sub.connect(sg).connect(master);
    sub.start(t); sub.stop(t + 1.7);

    /* Schicht 4: berstendes Metall */
    const metal = a.createOscillator();
    const mg = a.createGain();
    metal.type = "square";
    metal.frequency.setValueAtTime(1100, t);
    metal.frequency.exponentialRampToValueAtTime(64, t + 0.26);
    mg.gain.setValueAtTime(0.0001, t);
    mg.gain.exponentialRampToValueAtTime(0.3, t + 0.006);
    mg.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
    metal.connect(mg); mg.connect(master); mg.connect(reverb);
    metal.start(t); metal.stop(t + 0.36);
  }

  /* Trümmerregen: viele kurze Einschläge über zwei Sekunden verteilt */
  function playDebrisRain() {
    const a = resume(); if (!a) return;
    const t0 = a.currentTime;
    for (let i = 0; i < 26; i++) {
      const t = t0 + 0.25 + Math.random() * 2.1;
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = "triangle";
      const f = rand(150, 900);
      o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(f * 0.4, t + 0.06);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(rand(0.02, 0.07), t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      o.connect(g); g.connect(master); g.connect(reverb);
      o.start(t); o.stop(t + 0.12);
    }
  }

  /* Leises Knistern des brennenden Wracks */
  let fireNode = null;
  function startFireLoop() {
    const a = resume(); if (!a || fireNode) return;
    const src = a.createBufferSource();
    src.buffer = noiseBuffer(3, 0);
    src.loop = true;
    const bp = a.createBiquadFilter();
    bp.type = "bandpass";
    bp.frequency.value = 900;
    bp.Q.value = 0.6;
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.09, a.currentTime + 0.6);
    src.connect(bp).connect(g).connect(master);
    src.start();
    fireNode = { src: src, gain: g };
  }
  function stopFireLoop() {
    if (!fireNode) return;
    const g = fireNode.gain, src = fireNode.src;
    g.gain.setTargetAtTime(0.0001, ac.currentTime, 0.3);
    setTimeout(function () { try { src.stop(); } catch (e) {} }, 1200);
    fireNode = null;
  }


  /* ==================== 3. Szenendeko erzeugen =================== */

  /* Deterministischer Zufall, damit Bäume und Gras bei jedem Laden gleich
     aussehen (sonst "springt" die Silhouette beim Neuladen). */
  function seeded(seed) {
    let s = seed >>> 0;
    return function () {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  }

  /* Nadelbaum-Silhouette als ein einziger Pfad */
  function buildTrees() {
    const r = seeded(20240719);
    let d = "M0 200 L0 150 ";
    let x = 0;
    while (x < 1200) {
      const w = rand(14, 30) * (0.6 + r() * 0.8);
      const h = 40 + r() * 78;
      const base = 150 + r() * 14;
      /* Zackige Tanne: drei Stufen nach oben */
      d += `L${(x).toFixed(1)} ${base.toFixed(1)} `
        +  `L${(x + w * 0.30).toFixed(1)} ${(base - h * 0.38).toFixed(1)} `
        +  `L${(x + w * 0.16).toFixed(1)} ${(base - h * 0.40).toFixed(1)} `
        +  `L${(x + w * 0.44).toFixed(1)} ${(base - h * 0.74).toFixed(1)} `
        +  `L${(x + w * 0.32).toFixed(1)} ${(base - h * 0.76).toFixed(1)} `
        +  `L${(x + w * 0.50).toFixed(1)} ${(base - h).toFixed(1)} `
        +  `L${(x + w * 0.68).toFixed(1)} ${(base - h * 0.76).toFixed(1)} `
        +  `L${(x + w * 0.56).toFixed(1)} ${(base - h * 0.74).toFixed(1)} `
        +  `L${(x + w * 0.84).toFixed(1)} ${(base - h * 0.40).toFixed(1)} `
        +  `L${(x + w * 0.70).toFixed(1)} ${(base - h * 0.38).toFixed(1)} `
        +  `L${(x + w).toFixed(1)} ${base.toFixed(1)} `;
      x += w * (0.72 + r() * 0.5);
    }
    d += "L1200 150 L1200 200 Z";
    $("#treePath").setAttribute("d", d);
  }

  /* Grasbüschel im Vordergrund */
  function buildGrass() {
    const r = seeded(773311);
    let d = "M0 120 L0 74 ";
    let x = 0;
    while (x < 1200) {
      const w = 5 + r() * 13;
      const h = 16 + r() * 44;
      d += `L${x.toFixed(1)} 78 Q${(x + w * 0.5).toFixed(1)} ${(78 - h).toFixed(1)} `
        +  `${(x + w).toFixed(1)} 78 `;
      x += w * (0.5 + r() * 0.7);
    }
    d += "L1200 74 L1200 120 Z";
    $("#grassPath").setAttribute("d", d);
  }

  /* Telegrafenmasten in unregelmäßigem Abstand */
  function buildPoles() {
    const host = $("#poles");
    const r = seeded(90210);
    let x = 3;
    let html = "";
    while (x < 100) {
      const h = 52 + r() * 26;
      html += `<i style="left:${x.toFixed(1)}%;height:${h.toFixed(0)}%"></i>`;
      x += 9 + r() * 9;
    }
    host.innerHTML = html;
  }

  /* --- Sternenhimmel mit Funkeln und gelegentlichen Sternschnuppen --- */
  const stars = [];
  const shooters = [];

  function buildStars() {
    stars.length = 0;
    const n = Math.round((skyfx.clientWidth * skyfx.clientHeight) / 7000);
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random(),
        y: Math.random(),
        r: Math.random() < 0.14 ? rand(1.3, 2.1) : rand(0.5, 1.15),
        base: rand(0.25, 0.9),
        sp: rand(0.4, 2.0),
        ph: Math.random() * Math.PI * 2,
        warm: Math.random() < 0.2
      });
    }
  }

  function drawSky(time) {
    const w = skyfx.clientWidth, h = skyfx.clientHeight;
    sctx.clearRect(0, 0, w, h);

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      /* Sterne verblassen zum Horizont hin */
      const fade = clamp(1 - s.y * 1.15, 0, 1);
      const tw = 0.65 + 0.35 * Math.sin(time * 0.001 * s.sp + s.ph);
      const alpha = s.base * tw * fade;
      if (alpha <= 0.01) continue;
      sctx.globalAlpha = alpha;
      sctx.fillStyle = s.warm ? "#ffe6bd" : "#eaf2ff";
      sctx.beginPath();
      sctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
      sctx.fill();
    }
    sctx.globalAlpha = 1;

    /* Sternschnuppen */
    if (!reduceMotion && Math.random() < 0.0016 && shooters.length < 2) {
      shooters.push({
        x: rand(0.1, 0.9) * w, y: rand(0.05, 0.4) * h,
        vx: rand(3.5, 7), vy: rand(1.2, 2.6), life: 1
      });
    }
    for (let i = shooters.length - 1; i >= 0; i--) {
      const s = shooters[i];
      s.x += s.vx; s.y += s.vy; s.life -= 0.012;
      if (s.life <= 0) { shooters.splice(i, 1); continue; }
      const g = sctx.createLinearGradient(s.x, s.y, s.x - s.vx * 14, s.y - s.vy * 14);
      g.addColorStop(0, `rgba(255,255,255,${(s.life * 0.9).toFixed(3)})`);
      g.addColorStop(1, "rgba(255,255,255,0)");
      sctx.strokeStyle = g;
      sctx.lineWidth = 2;
      sctx.lineCap = "round";
      sctx.beginPath();
      sctx.moveTo(s.x, s.y);
      sctx.lineTo(s.x - s.vx * 14, s.y - s.vy * 14);
      sctx.stroke();
    }
  }


  /* ================= 4. Parallaxe und Screenshake ================ */

  const layers = $$("[data-depth]");
  let pointerX = 0;   /* Ziel, -1..1 */
  let camX = 0;       /* geglättet */

  if (!reduceMotion) {
    window.addEventListener("pointermove", function (e) {
      pointerX = (e.clientX / window.innerWidth - 0.5) * 2;
    }, { passive: true });
  }

  function updateParallax(time) {
    /* Sanfte Eigenbewegung, damit das Bild auch ohne Maus lebt */
    const driftX = Math.sin(time * 0.00013) * 0.35;
    camX += ((pointerX + driftX) - camX) * 0.045;

    /* Bewusst nur waagerecht: ein senkrechter Versatz laesst Gleis und
       Boden unter dem Zug wandern, was aussieht, als wuerde er schweben. */
    for (let i = 0; i < layers.length; i++) {
      const el = layers[i];
      const d = parseFloat(el.dataset.depth) || 0;
      el.style.transform = `translate3d(${(-camX * d * 0.9).toFixed(2)}px, 0, 0)`;
    }
  }

  let shakeAmt = 0, shakeDecay = 0;

  function addShake(amount) {
    if (!settings.shake) return;
    shakeAmt = Math.max(shakeAmt, amount);
    shakeDecay = amount / 55;
  }

  function updateShake() {
    if (shakeAmt <= 0.01) {
      camera.style.transform = "";
      shakeAmt = 0;
      return;
    }
    const a = shakeAmt;
    camera.style.transform =
      `translate3d(${rand(-a, a).toFixed(2)}px, ${rand(-a, a).toFixed(2)}px, 0)` +
      ` rotate(${rand(-a, a) * 0.035}deg)`;
    shakeAmt -= shakeDecay;
  }


  /* ==================== 5. Partikelsystem ======================= */

  const FIRE   = ["#fff6cc", "#ffd166", "#ff9f1c", "#f4501e", "#c1200f"];
  const SMOKE  = ["#3c3a37", "#4a4641", "#2e2c2a", "#565049"];
  /* Bewusst gedeckt und dunkel: helle Farben lesen sich sonst als Konfetti */
  const DEBRIS = ["#1c252d", "#5a2e21", "#20402e", "#454f59", "#6b5520", "#241209"];

  const parts = [];
  const waves = [];
  const flies = [];   /* Glühwürmchen, immer aktiv */

  let dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    [fx, skyfx].forEach(function (c) {
      const w = c.clientWidth, h = c.clientHeight;
      c.width  = Math.max(1, Math.round(w * dpr));
      c.height = Math.max(1, Math.round(h * dpr));
      c.getContext("2d").setTransform(dpr, 0, 0, dpr, 0, 0);
    });
    buildStars();
    buildFlies();
  }

  function buildFlies() {
    flies.length = 0;
    const n = Math.round(app.clientWidth / 90);
    const gy = groundY();
    for (let i = 0; i < n; i++) {
      flies.push({
        x: Math.random() * app.clientWidth,
        y: gy - rand(-30, 150),
        r: rand(1.2, 2.4),
        ph: Math.random() * Math.PI * 2,
        sp: rand(0.15, 0.5),
        amp: rand(8, 26),
        blink: rand(0.6, 1.8)
      });
    }
  }

  function push(p) { parts.push(p); }

  /* ---- Hauptexplosion ---- */
  function spawnBlast(cx, cy) {
    const S = sceneScale();

    /* Rauch (zuerst, wird durch die Ebenenreihenfolge hinten gezeichnet) */
    for (let i = 0; i < Math.round(150 * settings.quality); i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = rand(0.5, 6) * S;
      push({ type: "smoke",
        x: cx + rand(-0.5, 0.5) * 240 * S, y: cy + rand(-0.5, 0.5) * 80 * S,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.8,
        r: rand(28, 90) * S, life: 1, decay: rand(0.004, 0.010),
        grav: -0.055, drag: 0.982,
        color: SMOKE[(Math.random() * SMOKE.length) | 0] });
    }

    /* Feuerball in drei zeitversetzten Wellen */
    for (let wave = 0; wave < 3; wave++) {
      const delay = wave * 60;
      setTimeout(function () {
        const n = Math.round([150, 90, 60][wave] * settings.quality);
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = Math.sqrt(Math.random()) * (14 - wave * 3) * S;
          push({ type: "fire",
            x: cx + rand(-0.5, 0.5) * 130 * S, y: cy + rand(-0.5, 0.5) * 55 * S,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2.2,
            r: rand(16, 54) * S, life: 1, decay: rand(0.016, 0.03),
            grav: -0.025, drag: 0.955,
            color: FIRE[(Math.random() * FIRE.length) | 0] });
        }
      }, delay);
    }

    /* Funken */
    for (let i = 0; i < Math.round(125 * settings.quality); i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = rand(9, 30) * S;
      push({ type: "spark",
        x: cx + rand(-20, 20) * S, y: cy,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3,
        r: rand(1.4, 3.2), life: 1, decay: rand(0.008, 0.02),
        grav: 0.32, drag: 0.99,
        color: Math.random() < 0.3 ? "#fff6d8" : "#ffc857" });
    }

    /* Bodenstaub: läuft flach nach beiden Seiten weg */
    for (let i = 0; i < Math.round(70 * settings.quality); i++) {
      const dir = Math.random() < 0.5 ? -1 : 1;
      push({ type: "smoke",
        x: cx + rand(-40, 40) * S, y: groundY() - rand(0, 18),
        vx: dir * rand(4, 15) * S, vy: rand(-1.2, 0.4),
        r: rand(20, 60) * S, life: 1, decay: rand(0.008, 0.016),
        grav: -0.012, drag: 0.955,
        color: "#4b4535" });
    }

    /* Trümmer, teils mit Feuerschweif */
    const gy = groundY();
    for (let i = 0; i < Math.round(70 * settings.quality); i++) {
      const a = -Math.PI / 2 + rand(-0.5, 0.5) * Math.PI * 1.7;
      const sp = rand(7, 22) * S;
      push({ type: "debris",
        x: cx + rand(-0.5, 0.5) * 260 * S, y: cy + rand(-0.5, 0.5) * 60 * S,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        w: rand(5, 20) * S, h: rand(4, 15) * S,
        rot: Math.random() * Math.PI, vr: rand(-0.3, 0.3),
        life: 1, decay: 0.0035, grav: 0.42, drag: 0.995,
        burning: Math.random() < 0.45, rest: gy + rand(-4, 10), landed: false,
        color: DEBRIS[(Math.random() * DEBRIS.length) | 0] });
    }

    waves.push({ x: cx, y: cy, r: 12 * S, life: 1, s: S });
  }

  /* ---- Kleiner Vorknall am Kessel ---- */
  function spawnPrePop(cx, cy) {
    const S = sceneScale();
    for (let i = 0; i < Math.round(40 * settings.quality); i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = rand(1, 7) * S;
      push({ type: "fire",
        x: cx + rand(-25, 25) * S, y: cy + rand(-15, 15) * S,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5,
        r: rand(8, 26) * S, life: 1, decay: rand(0.03, 0.05),

        color: FIRE[(Math.random() * FIRE.length) | 0] });
    }
    waves.push({ x: cx, y: cy, r: 6 * S, life: 0.55, s: S * 0.5 });
  }

  /* ---- Nachbrenner am Wrack ---- */
  function spawnEmbers(cx, cy) {
    const S = sceneScale();
    const gy = groundY();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + rand(-0.6, 0.6);
      const sp = rand(1, 3.2);
      push({ type: "fire",
        x: cx + rand(-0.5, 0.5) * 340 * S, y: gy - rand(0, 16),
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: rand(9, 24) * S, life: 1, decay: rand(0.018, 0.035),
        grav: -0.05, drag: 0.97,
        color: FIRE[1 + ((Math.random() * 4) | 0)] });
    }
    /* aufsteigende Rauchsäule */
    for (let i = 0; i < 2; i++) {
      push({ type: "smoke",
        x: cx + rand(-0.5, 0.5) * 200 * S, y: gy - rand(0, 20),
        vx: rand(-0.6, 0.6), vy: rand(-1.6, -0.7),
        r: rand(24, 54) * S, life: 1, decay: rand(0.0035, 0.007),
        grav: -0.03, drag: 0.99,
        color: SMOKE[(Math.random() * SMOKE.length) | 0] });
    }
    /* einzelne Glutfunken */
    for (let i = 0; i < 3; i++) {
      push({ type: "spark",
        x: cx + rand(-0.5, 0.5) * 320 * S, y: gy - rand(0, 12),
        vx: rand(-1, 1), vy: rand(-3.5, -1.5),
        r: rand(1, 2), life: 1, decay: rand(0.008, 0.016),
        grav: -0.02, drag: 0.985,
        color: "#ff9f1c" });
    }
  }

  /* ---- Zeichnen ---- */
  function hexRgba(hex, alpha) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha.toFixed(3)})`;
  }

  const LAYER_ORDER = ["smoke", "debris", "fire", "spark"];

  function drawParticle(p) {
    if (p.type === "debris") {
      if (p.burning && !p.landed) {
        /* kurzer Feuerschweif hinter dem Trümmerstück */
        ctx.globalCompositeOperation = "lighter";
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.w * 1.9);
        g.addColorStop(0, `rgba(255,190,80,${(0.5 * p.life).toFixed(3)})`);
        g.addColorStop(1, "rgba(255,120,20,0)");
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.w * 1.9, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalCompositeOperation = "source-over";
      }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, p.life * 1.6);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
      ctx.globalAlpha = 1;
      return;
    }

    if (p.type === "spark") {
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = Math.min(1, p.life * 1.4);
      ctx.strokeStyle = p.color;
      ctx.lineCap = "round";
      ctx.lineWidth = p.r;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 1.9, p.y - p.vy * 1.9);
      ctx.stroke();
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      return;
    }

    const rr = p.type === "smoke"
      ? Math.max(1, p.r * (2.3 - p.life))
      : Math.max(1, p.r * (0.45 + p.life * 0.55));

    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr);
    if (p.type === "fire") {
      ctx.globalCompositeOperation = "lighter";
      g.addColorStop(0,    hexRgba(p.color, 0.85 * p.life));
      g.addColorStop(0.45, hexRgba(p.color, 0.34 * p.life));
      g.addColorStop(1,    hexRgba(p.color, 0));
    } else {
      const a = Math.min(0.3, p.life * 0.38);
      g.addColorStop(0,   hexRgba(p.color, a));
      g.addColorStop(0.6, hexRgba(p.color, a * 0.6));
      g.addColorStop(1,   hexRgba(p.color, 0));
    }
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, rr, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  }

  function drawFlies(time) {
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < flies.length; i++) {
      const f = flies[i];
      const t = time * 0.001;
      const x = f.x + Math.sin(t * f.sp + f.ph) * f.amp;
      const y = f.y + Math.cos(t * f.sp * 0.7 + f.ph) * f.amp * 0.6;
      const a = 0.28 + 0.32 * Math.sin(t * f.blink + f.ph * 2);
      if (a <= 0.02) continue;
      const g = ctx.createRadialGradient(x, y, 0, x, y, f.r * 5);
      g.addColorStop(0, `rgba(255,226,140,${a.toFixed(3)})`);
      g.addColorStop(1, "rgba(255,200,90,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, f.r * 5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  /* ---- Hauptschleife ---- */
  let fireGlow = 0;

  function frame(time) {
    updateParallax(time);
    updateShake();
    drawSky(time);

    ctx.clearRect(0, 0, fx.clientWidth, fx.clientHeight);

    if (!exploded) drawFlies(time);

    /* Druckwellen */
    for (let i = waves.length - 1; i >= 0; i--) {
      const s = waves[i];
      s.r += 26 * s.s;
      s.life -= 0.075;
      if (s.life <= 0) { waves.splice(i, 1); continue; }
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255,228,175,${(s.life * s.life * 0.8).toFixed(3)})`;
      ctx.lineWidth = 18 * s.life * s.s;
      ctx.stroke();
    }

    /* Physik, dabei tote Partikel aussortieren */
    let w = 0, heat = 0;
    const gy = groundY();
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];

      if (p.type === "debris" && p.landed) {
        p.life -= 0.0022;
      } else {
        p.vx *= p.drag;
        p.vy = p.vy * p.drag + p.grav;
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.type === "debris") {
          p.rot += p.vr;
          /* auf dem Boden liegen bleiben statt durchzufallen */
          if (p.vy > 0 && p.y >= p.rest) {
            p.y = p.rest;
            p.landed = true;
            p.burning = false;
            p.vx = p.vy = p.vr = 0;
          }
        }
      }

      if (p.type === "fire") heat += p.life;
      if (p.life > 0) parts[w++] = p;
    }
    parts.length = w;

    /* Feuerschein über der ganzen Szene */
    const target = clamp(heat / 260, 0, 0.85);
    fireGlow += (target - fireGlow) * (target > fireGlow ? 0.55 : 0.06);
    firelight.style.opacity = fireGlow.toFixed(3);

    for (let l = 0; l < LAYER_ORDER.length; l++) {
      const layer = LAYER_ORDER[l];
      for (let i = 0; i < parts.length; i++) {
        if (parts[i].type === layer) drawParticle(parts[i]);
      }
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }


  /* ================== 6. Explosionssequenz ====================== */

  let exploded = false;
  let emberTimer = null;
  const timers = [];

  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

  function trainCenter() {
    const t = train.getBoundingClientRect();
    const a = app.getBoundingClientRect();
    return { x: t.left + t.width / 2 - a.left, y: t.top + t.height / 2 - a.top };
  }

  function doFlash(strength, ms) {
    flash.style.transition = "none";
    flash.style.opacity = String(strength);
    requestAnimationFrame(function () {
      flash.style.transition = `opacity ${ms}ms ease-out`;
      flash.style.opacity = "0";
    });
  }

  function blastParts(cx) {
    const S = sceneScale();
    const a = app.getBoundingClientRect();
    $$("#train .part").forEach(function (part) {
      const r = part.getBoundingClientRect();
      const pcx = r.left + r.width / 2 - a.left;
      const dir = pcx < cx ? -1 : 1;
      const dist = Math.abs(pcx - cx) / 100 + 0.6;

      const dx  = dir * rand(160, 400) * dist * S;
      const dy  = -rand(140, 340) * S;
      const rot = dir * rand(120, 460);

      part.style.transition =
        "transform 1s cubic-bezier(.14,.62,.44,1), opacity .95s ease-in";
      part.style.transform =
        `translate(${dx.toFixed(0)}px, ${dy.toFixed(0)}px) rotate(${rot.toFixed(0)}deg) scale(.82)`;
      part.style.opacity = "0";
    });
  }

  function explode() {
    if (exploded) return;
    exploded = true;
    startBtn.disabled = true;
    hint.textContent = "";

    resume();
    playWhistle(0.95);
    train.classList.add("rumbling");
    addShake(3);

    /* Vorknall */
    later(function () {
      const c = trainCenter();
      firelight.style.setProperty("--fx-x", (c.x / app.clientWidth  * 100).toFixed(1) + "%");
      firelight.style.setProperty("--fx-y", (c.y / app.clientHeight * 100).toFixed(1) + "%");
      playThud();
      spawnPrePop(c.x - 40, c.y - 10);
      doFlash(0.35, 260);
      addShake(9);
    }, 850);

    /* Hauptknall */
    later(function () {
      train.classList.remove("rumbling");
      beam.style.transition = "opacity .2s";
      beam.style.opacity = "0";

      const c = trainCenter();
      firelight.style.setProperty("--fx-x", (c.x / app.clientWidth  * 100).toFixed(1) + "%");
      firelight.style.setProperty("--fx-y", (c.y / app.clientHeight * 100).toFixed(1) + "%");
      playBlast();
      playDebrisRain();
      spawnBlast(c.x, c.y);
      blastParts(c.x);
      doFlash(0.95, 480);
      addShake(38 * clamp(sceneScale(), 0.5, 1.3));

      later(startFireLoop, 350);

      /* Das Wrack brennt noch eine Weile nach */
      let n = 0;
      emberTimer = setInterval(function () {
        spawnEmbers(c.x, c.y);
        if (++n > 46) { clearInterval(emberTimer); emberTimer = null; stopFireLoop(); }
      }, 110);
    }, 1150);

    /* Der Button quittiert */
    later(function () {
      startBtn.querySelector(".lbl").textContent = "cool";
      startBtn.classList.add("done");
      startBtn.disabled = false;
      hint.textContent = "Taste R setzt die Szene zurück.";
    }, 1900);
  }

  /* Szene in den Ausgangszustand bringen */
  function reset() {
    timers.forEach(clearTimeout);
    timers.length = 0;
    if (emberTimer) { clearInterval(emberTimer); emberTimer = null; }
    stopFireLoop();

    parts.length = 0;
    waves.length = 0;
    fireGlow = 0;
    firelight.style.opacity = "0";
    shakeAmt = 0;
    camera.style.transform = "";

    $$("#train .part").forEach(function (p) {
      p.style.transition = "none";
      p.style.transform = "";
      p.style.opacity = "";
    });
    /* Reflow erzwingen, damit die entfernte Transition nicht nachwirkt */
    void train.offsetWidth;
    $$("#train .part").forEach(function (p) { p.style.transition = ""; });

    train.classList.remove("rumbling");
    beam.style.transition = "opacity .4s";
    beam.style.opacity = "";

    startBtn.querySelector(".lbl").textContent = "Start";
    startBtn.classList.remove("done");
    startBtn.disabled = false;
    hint.textContent = "Pfeiltasten zum Wählen, Enter zum Bestätigen.";

    exploded = false;
  }


  /* ============ 7. Menü, Panels und Tastatursteuerung =========== */

  const menu = $("#menu");
  const menuBtns = $$(".btn", menu);
  const scrim = $("#scrim");
  let sel = 0;
  let openPanel = null;

  function select(i) {
    sel = (i + menuBtns.length) % menuBtns.length;
    menuBtns.forEach(function (b, n) { b.classList.toggle("sel", n === sel); });
    menuBtns[sel].focus({ preventScroll: true });
    uiTick();
  }

  function showPanel(name) {
    openPanel = name;
    scrim.hidden = false;
    $$(".panel", scrim).forEach(function (p) { p.hidden = p.id !== "panel-" + name; });
    const first = $(".panel:not([hidden]) input, .panel:not([hidden]) button", scrim);
    if (first) first.focus({ preventScroll: true });
    uiConfirm();
  }

  function closePanel() {
    if (!openPanel) return;
    openPanel = null;
    scrim.hidden = true;
    $$(".panel", scrim).forEach(function (p) { p.hidden = true; });
    menuBtns[sel].focus({ preventScroll: true });
    uiTick();
  }

  menuBtns.forEach(function (btn, i) {
    btn.addEventListener("mouseenter", function () {
      if (sel !== i) { sel = i; menuBtns.forEach(function (b, n) { b.classList.toggle("sel", n === sel); }); uiTick(); }
    });
    btn.addEventListener("click", function () {
      const action = btn.dataset.action;
      if (action === "start") {
        if (exploded) { uiTick(); return; }
        uiConfirm();
        explode();
      } else if (action === "panel") {
        showPanel(btn.dataset.panel);
      }
    });
  });

  $$("[data-close]", scrim).forEach(function (b) {
    b.addEventListener("click", closePanel);
  });
  scrim.addEventListener("click", function (e) {
    if (e.target === scrim) closePanel();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closePanel(); return; }
    if (openPanel) return;

    if (e.key === "ArrowDown") { e.preventDefault(); select(sel + 1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); select(sel - 1); }
    else if (e.key === "Enter" || e.key === " ") {
      /* Enter auf einem fokussierten Button löst ohnehin click aus */
      if (document.activeElement !== menuBtns[sel]) {
        e.preventDefault();
        menuBtns[sel].click();
      }
    }
    else if (e.key === "r" || e.key === "R") { reset(); uiTick(); }
  });

  /* --- Optionen --- */
  const optVolume  = $("#optVolume");
  const outVolume  = $("#outVolume");
  const optShake   = $("#optShake");
  const optQuality = $("#optQuality");

  optVolume.value  = settings.volume;
  outVolume.value  = settings.volume;
  optShake.checked = settings.shake;
  optQuality.value = String(settings.quality);

  optVolume.addEventListener("input", function () {
    const v = Number(optVolume.value);
    outVolume.value = v;
    setVolume(v);
  });
  optVolume.addEventListener("change", function () { saveSettings(); uiTick(); });

  optShake.addEventListener("change", function () {
    settings.shake = optShake.checked;
    saveSettings();
    uiTick();
  });

  optQuality.addEventListener("change", function () {
    settings.quality = Number(optQuality.value);
    saveSettings();
    uiTick();
  });


  /* ========================== Start ============================= */

  buildTrees();
  buildGrass();
  buildPoles();
  resize();

  window.addEventListener("resize", resize);
  menuBtns[0].classList.add("sel");

  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
