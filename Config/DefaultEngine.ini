[/Script/Engine.CollisionProfile]
; Two custom channels.
;
; Interaction is a trace channel so the "press E" probe can be a cheap line
; trace that only hits things which advertise themselves as usable - a trace
; against Visibility would be stopped by every crate and handrail in the cab.
;
; TrainBody is an object channel so enemy fire, damage volumes and the player's
; own movement can reason about "part of the train" without tag comparisons.
-DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Interaction")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="Interaction")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="TrainBody")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel3,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="Weapon")

+Profiles=(Name="TrainVehicle",CollisionEnabled=QueryAndPhysics,ObjectTypeName="TrainBody",CustomResponses=((Channel="Visibility",Response=ECR_Block),(Channel="Camera",Response=ECR_Block),(Channel="Weapon",Response=ECR_Block),(Channel="Interaction",Response=ECR_Ignore)),HelpMessage="The hull of a locomotive or wagon: walkable, shootable, blocks the player.")
+Profiles=(Name="Interactable",CollisionEnabled=QueryOnly,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="Interaction",Response=ECR_Block),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="Pawn",Response=ECR_Ignore)),HelpMessage="A volume the interaction probe can hit. Blocks nothing else.")

