<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAIL BLAST</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===================================================================
     Wiederverwendbare Bauteile und Farbverläufe der Zug-Illustration.
     Liegt einmal im Dokument, alle Fahrzeuge referenzieren es per <use>.
     =================================================================== -->
<svg id="artdefs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gBoiler" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a232d"/>
      <stop offset="18%"  stop-color="#4e677c"/>
      <stop offset="38%"  stop-color="#7d94a8"/>
      <stop offset="60%"  stop-color="#3a4c5e"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="gSmokebox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#191f26"/>
      <stop offset="30%"  stop-color="#404b58"/>
      <stop offset="56%"  stop-color="#242d36"/>
      <stop offset="100%" stop-color="#0d1217"/>
    </linearGradient>
    <linearGradient id="gCab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9c4e3a"/>
      <stop offset="30%"  stop-color="#c26b50"/>
      <stop offset="66%"  stop-color="#7c3620"/>
      <stop offset="100%" stop-color="#3f180f"/>
    </linearGradient>
    <linearGradient id="gCoach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2b6a4b"/>
      <stop offset="30%"  stop-color="#489669"/>
      <stop offset="66%"  stop-color="#22523a"/>
      <stop offset="100%" stop-color="#0f281c"/>
    </linearGradient>
    <linearGradient id="gCoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3d3d44"/>
      <stop offset="100%" stop-color="#0f0f12"/>
    </linearGradient>
    <linearGradient id="gWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff4cd"/>
      <stop offset="100%" stop-color="#f0bd55"/>
    </linearGradient>
    <linearGradient id="gSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#aebbc8"/>
      <stop offset="45%"  stop-color="#67757f"/>
      <stop offset="100%" stop-color="#2b343c"/>
    </linearGradient>
    <radialGradient id="gLamp" cx="42%" cy="36%" r="64%">
      <stop offset="0%"   stop-color="#fffdf0"/>
      <stop offset="45%"  stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#d18f16"/>
    </radialGradient>

    <!-- Weiches Glühen für Lampe und Fenster -->
    <filter id="fGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Treibrad: Speichen, Nabe, Gegengewicht -->
    <g id="wheelBig">
      <circle r="28" fill="#12181e"/>
      <circle r="28" fill="none" stroke="#93a2b1" stroke-width="4"/>
      <circle r="22.5" fill="#27313c"/>
      <g stroke="#63717f" stroke-width="4" stroke-linecap="round">
        <line y1="-20.5" y2="20.5"/>
        <line y1="-20.5" y2="20.5" transform="rotate(30)"/>
        <line y1="-20.5" y2="20.5" transform="rotate(60)"/>
        <line y1="-20.5" y2="20.5" transform="rotate(90)"/>
        <line y1="-20.5" y2="20.5" transform="rotate(120)"/>
        <line y1="-20.5" y2="20.5" transform="rotate(150)"/>
      </g>
      <path d="M17.6 12.3 A21.5 21.5 0 0 1 -17.6 12.3 L-8.2 5.7 A10 10 0 0 0 8.2 5.7 Z" fill="#3d4a58"/>
      <circle r="8" fill="#3d4a58" stroke="#12181e" stroke-width="2"/>
      <circle r="3" fill="#9dabb9"/>
    </g>

    <!-- Laufrad -->
    <g id="wheelSmall">
      <circle r="15" fill="#12181e"/>
      <circle r="15" fill="none" stroke="#93a2b1" stroke-width="3"/>
      <circle r="10.5" fill="#27313c"/>
      <g stroke="#63717f" stroke-width="3" stroke-linecap="round">
        <line y1="-9" y2="9"/>
        <line y1="-9" y2="9" transform="rotate(45)"/>
        <line y1="-9" y2="9" transform="rotate(90)"/>
        <line y1="-9" y2="9" transform="rotate(135)"/>
      </g>
      <circle r="4" fill="#3d4a58" stroke="#12181e" stroke-width="1.5"/>
    </g>
  </defs>
</svg>


<div id="app">

  <!-- #camera bekommt den Screenshake, #world die Parallaxe -->
  <div id="camera">
    <div id="world">

      <div class="layer sky"       data-depth="0"></div>
      <canvas class="layer" id="skyfx" data-depth="2"></canvas>
      <div class="layer moon"      data-depth="3"></div>
      <div class="layer glowband"  data-depth="2"></div>

      <!-- Ferne Bergkette -->
      <svg class="layer ridge ridge-far" data-depth="6" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 300 V190 L74 118 L128 163 L206 84 L272 148 L338 104 L418 172 L498 116
                 L556 168 L640 96 L716 158 L788 126 L860 176 L938 110 L1016 164 L1098 130
                 L1200 172 V300 Z"/>
      </svg>
      <div class="layer haze haze-far" data-depth="7"></div>

      <!-- Mittlere Hügelkette -->
      <svg class="layer ridge ridge-mid" data-depth="11" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 300 V228 Q96 186 196 220 Q296 254 398 208 Q516 158 618 212
                 Q722 262 822 214 Q922 170 1024 218 Q1124 258 1200 222 V300 Z"/>
      </svg>
      <div class="layer haze haze-mid" data-depth="13"></div>

      <!-- Baumsilhouetten, Pfad wird per JS erzeugt -->
      <svg class="layer treeline" data-depth="18" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
        <path id="treePath"/>
      </svg>

      <!-- Telegrafenmasten, per JS erzeugt -->
      <div class="layer poles" data-depth="22" id="poles"></div>

      <div class="layer ground" data-depth="26"></div>

      <!-- Gleis über die ganze Bildbreite -->
      <div class="layer track" data-depth="30">
        <div class="rail far"></div>
        <div class="sleepers"></div>
        <div class="rail near"><i class="shine"></i></div>
      </div>

      <div id="trainWrap">
        <!-- Lichtkegel des Spitzenlichts, sitzt vor der Lok -->
        <div id="beam"></div>
        <div id="train">

        <!-- ===================== Dampflokomotive ===================== -->
        <div class="part loco">
          <span class="steam"></span><span class="steam"></span><span class="steam"></span>
          <svg viewBox="0 0 280 150" width="280" height="150" aria-hidden="true">
            <rect x="258" y="86" width="18" height="9" rx="2" fill="#27313c" stroke="#0e151b" stroke-width="2"/>

            <use href="#wheelSmall" x="42" y="133.5"/>
            <use href="#wheelBig" x="112" y="120"/>
            <use href="#wheelBig" x="186" y="120"/>

            <rect x="94" y="128" width="92" height="8" rx="4" fill="url(#gSteel)" stroke="#12181e" stroke-width="2"/>
            <circle cx="112" cy="132" r="4.5" fill="#3a4550" stroke="#12181e" stroke-width="1.5"/>
            <circle cx="186" cy="132" r="4.5" fill="#3a4550" stroke="#12181e" stroke-width="1.5"/>

            <rect x="18" y="84" width="252" height="13" rx="3" fill="#212932" stroke="#0e151b" stroke-width="2.5"/>
            <rect x="22" y="87" width="244" height="3" fill="#44515f" opacity=".7"/>

            <rect x="56" y="97" width="40" height="26" rx="5" fill="#2b3540" stroke="#0e151b" stroke-width="2.5"/>
            <rect x="60" y="101" width="32" height="4" rx="2" fill="#5f6d7a" opacity=".65"/>

            <path d="M30 92 L4 139 L30 139 Z" fill="#8e4331" stroke="#2e110b" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M26 102 L15 134 M30 108 L23 134" stroke="#2e110b" stroke-width="2" opacity=".5" stroke-linecap="round"/>

            <rect x="58" y="32" width="124" height="54" rx="9" fill="url(#gBoiler)" stroke="#0b1218" stroke-width="2.5"/>
            <g stroke="#d3a92c" stroke-width="3" opacity=".55">
              <line x1="90" y1="34" x2="90" y2="84"/>
              <line x1="138" y1="34" x2="138" y2="84"/>
              <line x1="170" y1="34" x2="170" y2="84"/>
            </g>

            <rect x="24" y="28" width="40" height="60" rx="14" fill="url(#gSmokebox)" stroke="#080d11" stroke-width="2.5"/>
            <ellipse cx="30" cy="58" rx="6" ry="25" fill="#2a343e" stroke="#080d11" stroke-width="2"/>
            <circle class="lamp" cx="30" cy="50" r="7.5" fill="url(#gLamp)" stroke="#080d11" stroke-width="1.5" filter="url(#fGlow)"/>
            <circle cx="30" cy="70" r="3" fill="#9dabb9"/>

            <path d="M34 34 L37 14 L30 14 L30 3 L64 3 L64 14 L57 14 L60 34 Z"
                  fill="url(#gSmokebox)" stroke="#080d11" stroke-width="2.5" stroke-linejoin="round"/>

            <path d="M100 36 L100 26 A17 12 0 0 1 134 26 L134 36 Z" fill="url(#gBoiler)" stroke="#0b1218" stroke-width="2.5"/>
            <path d="M144 36 L144 30 A11 8 0 0 1 166 30 L166 36 Z" fill="url(#gBoiler)" stroke="#0b1218" stroke-width="2.5"/>

            <rect x="180" y="26" width="78" height="70" rx="5" fill="url(#gCab)" stroke="#2e110b" stroke-width="2.5"/>
            <path d="M172 28 Q219 10 266 28 L266 37 Q219 19 172 37 Z"
                  fill="#3a1d14" stroke="#190a05" stroke-width="2.5" stroke-linejoin="round"/>
            <ellipse class="firelight" cx="218" cy="57" rx="40" ry="26" fill="#ffb23f" opacity=".2"/>
            <rect class="win" x="196" y="43" width="44" height="29" rx="4" fill="url(#gWin)" stroke="#2e110b" stroke-width="2.5"/>
            <line x1="218" y1="43" x2="218" y2="72" stroke="#2e110b" stroke-width="2.5"/>
          </svg>
        </div>

        <!-- ========================= Tender ========================= -->
        <div class="part tender">
          <svg viewBox="0 0 130 150" width="130" height="150" aria-hidden="true">
            <rect x="0" y="102" width="14" height="9" rx="2" fill="#27313c" stroke="#0e151b" stroke-width="2"/>
            <rect x="116" y="102" width="14" height="9" rx="2" fill="#27313c" stroke="#0e151b" stroke-width="2"/>

            <use href="#wheelSmall" x="34" y="133.5"/>
            <use href="#wheelSmall" x="96" y="133.5"/>

            <rect x="6" y="100" width="118" height="17" rx="3" fill="#212932" stroke="#0e151b" stroke-width="2.5"/>

            <rect x="10" y="56" width="110" height="46" rx="4" fill="url(#gCab)" stroke="#2e110b" stroke-width="2.5"/>
            <rect x="18" y="66" width="94" height="18" rx="3" fill="#000" opacity=".12"/>
            <line x1="65" y1="58" x2="65" y2="100" stroke="#2e110b" stroke-width="2" opacity=".45"/>
            <rect x="12" y="94" width="106" height="3" fill="#d3a92c" opacity=".5"/>

            <path d="M14 56 L23 44 L35 49 L47 37 L61 44 L75 35 L89 46 L101 42 L116 56 Z"
                  fill="url(#gCoal)" stroke="#08080a" stroke-width="2" stroke-linejoin="round"/>
            <g fill="#5b5b66" opacity=".85">
              <circle cx="38" cy="49" r="3"/><circle cx="63" cy="47" r="2.5"/>
              <circle cx="87" cy="50" r="3"/><circle cx="104" cy="50" r="2"/>
            </g>
          </svg>
        </div>

        <!-- ===================== Personenwagen ====================== -->
        <div class="part coach">
          <svg viewBox="0 0 175 150" width="175" height="150" aria-hidden="true">
            <rect x="0" y="102" width="14" height="9" rx="2" fill="#27313c" stroke="#0e151b" stroke-width="2"/>
            <rect x="161" y="102" width="14" height="9" rx="2" fill="#27313c" stroke="#0e151b" stroke-width="2"/>

            <use href="#wheelSmall" x="28" y="133.5"/>
            <use href="#wheelSmall" x="66" y="133.5"/>
            <use href="#wheelSmall" x="109" y="133.5"/>
            <use href="#wheelSmall" x="147" y="133.5"/>

            <rect x="20" y="117" width="54" height="9" rx="3" fill="#1a222a"/>
            <rect x="101" y="117" width="54" height="9" rx="3" fill="#1a222a"/>
            <rect x="6" y="100" width="163" height="17" rx="3" fill="#212932" stroke="#0e151b" stroke-width="2.5"/>

            <rect x="8" y="50" width="159" height="52" rx="5" fill="url(#gCoach)" stroke="#0c1f14" stroke-width="2.5"/>
            <path d="M4 54 Q87.5 26 171 54 L171 60 L4 60 Z"
                  fill="#28372e" stroke="#0c1f14" stroke-width="2.5" stroke-linejoin="round"/>

            <g class="win" fill="url(#gWin)" stroke="#0c1f14" stroke-width="2">
              <rect x="17"  y="66" width="21" height="21" rx="3"/>
              <rect x="47"  y="66" width="21" height="21" rx="3"/>
              <rect x="77"  y="66" width="21" height="21" rx="3"/>
              <rect x="107" y="66" width="21" height="21" rx="3"/>
              <rect x="137" y="66" width="21" height="21" rx="3"/>
            </g>
            <rect x="10" y="94" width="155" height="4" fill="#d3a92c" opacity=".55"/>
          </svg>
        </div>

        </div>
      </div>

      <!-- Grasbüschel im Vordergrund, Pfad wird per JS erzeugt -->
      <svg class="layer grass" data-depth="42" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
        <path id="grassPath"/>
      </svg>

    </div><!-- /#world -->

    <!-- Feuerschein: liegt auf der Landschaft, aber unter den Partikeln -->
    <div id="firelight"></div>

    <!-- Explosion, Funken, Glühwürmchen -->
    <canvas id="fx"></canvas>
  </div><!-- /#camera -->

  <!-- Bildlook: Randabdunklung und Blitz -->
  <div id="vignette"></div>
  <div id="flash"></div>

  <!-- =========================== Menü =========================== -->
  <div id="ui">
    <header class="brand">
      <!-- Spieltitel: hier ändern, wenn dein Spiel anders heißt -->
      <h1 class="title"><span class="t1">RAIL</span><span class="t2">BLAST</span></h1>
      <p class="tagline">Ein Zug. Ein Knopf. Keine Rückfahrkarte.</p>
    </header>

    <nav class="menu" id="menu" aria-label="Hauptmenü">
      <button class="btn primary" id="startBtn" data-action="start"><span class="lbl">Start</span></button>
      <button class="btn" data-action="panel" data-panel="options"><span class="lbl">Optionen</span></button>
      <button class="btn" data-action="panel" data-panel="keys"><span class="lbl">Steuerung</span></button>
    </nav>

    <p class="hint" id="hint">Pfeiltasten zum Wählen, Enter zum Bestätigen.</p>
    <p class="version">v1.0</p>
  </div>

  <!-- ========================== Panels ========================== -->
  <div class="scrim" id="scrim" hidden>

    <section class="panel" id="panel-options" role="dialog" aria-modal="true" aria-labelledby="h-options" hidden>
      <h2 id="h-options">Optionen</h2>

      <div class="row">
        <label for="optVolume">Lautstärke</label>
        <input type="range" id="optVolume" min="0" max="100" step="5" value="80">
        <output id="outVolume">80</output>
      </div>

      <div class="row">
        <label for="optShake">Bildschirmwackeln</label>
        <input type="checkbox" id="optShake" checked>
      </div>

      <div class="row">
        <label for="optQuality">Effektstärke</label>
        <select id="optQuality">
          <option value="0.5">Niedrig</option>
          <option value="1" selected>Mittel</option>
          <option value="1.7">Hoch</option>
        </select>
      </div>

      <button class="btn small" data-close><span class="lbl">Zurück</span></button>
    </section>

    <section class="panel" id="panel-keys" role="dialog" aria-modal="true" aria-labelledby="h-keys" hidden>
      <h2 id="h-keys">Steuerung</h2>
      <dl class="keys">
        <dt><kbd>&uarr;</kbd><kbd>&darr;</kbd></dt><dd>Menüpunkt wählen</dd>
        <dt><kbd>Enter</kbd></dt><dd>Bestätigen</dd>
        <dt><kbd>Esc</kbd></dt><dd>Zurück / Schließen</dd>
        <dt><kbd>R</kbd></dt><dd>Szene zurücksetzen</dd>
      </dl>
      <button class="btn small" data-close><span class="lbl">Zurück</span></button>
    </section>

  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
