<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAIL BLAST</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===================================================================
     Wiederverwendbare Bauteile und Farbverläufe der Zug-Illustration.
     Liegt einmal im Dokument, alle Fahrzeuge referenzieren es per <use>.
     =================================================================== -->
<svg id="artdefs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <!-- Kessel: enge Stops erzeugen die zylindrische Woelbung -->
    <linearGradient id="gBoiler" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#151d25"/>
      <stop offset="12%"  stop-color="#3f5668"/>
      <stop offset="28%"  stop-color="#7e94a8"/>
      <stop offset="40%"  stop-color="#5a6f83"/>
      <stop offset="62%"  stop-color="#33455a"/>
      <stop offset="84%"  stop-color="#1c2732"/>
      <stop offset="100%" stop-color="#0c1218"/>
    </linearGradient>
    <linearGradient id="gSmokebox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#141a20"/>
      <stop offset="26%"  stop-color="#3c4854"/>
      <stop offset="42%"  stop-color="#4c5a67"/>
      <stop offset="66%"  stop-color="#232c35"/>
      <stop offset="100%" stop-color="#0b1015"/>
    </linearGradient>
    <linearGradient id="gCab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6f3826"/>
      <stop offset="22%"  stop-color="#a15c45"/>
      <stop offset="46%"  stop-color="#8a4530"/>
      <stop offset="74%"  stop-color="#5a2415"/>
      <stop offset="100%" stop-color="#2f1109"/>
    </linearGradient>
    <linearGradient id="gRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#57302a"/>
      <stop offset="55%"  stop-color="#3a1d16"/>
      <stop offset="100%" stop-color="#1d0d08"/>
    </linearGradient>
    <linearGradient id="gRoof2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3c5347"/>
      <stop offset="55%"  stop-color="#25342b"/>
      <stop offset="100%" stop-color="#121c16"/>
    </linearGradient>
    <linearGradient id="gCoach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#22523c"/>
      <stop offset="22%"  stop-color="#3f8760"/>
      <stop offset="46%"  stop-color="#2d6647"/>
      <stop offset="74%"  stop-color="#1a4030"/>
      <stop offset="100%" stop-color="#0b1d15"/>
    </linearGradient>
    <linearGradient id="gFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3b4854"/>
      <stop offset="30%"  stop-color="#252e37"/>
      <stop offset="100%" stop-color="#10161c"/>
    </linearGradient>
    <linearGradient id="gCylinder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#46535f"/>
      <stop offset="34%"  stop-color="#2c3641"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="gPilot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a45340"/>
      <stop offset="50%"  stop-color="#7c3927"/>
      <stop offset="100%" stop-color="#43180f"/>
    </linearGradient>
    <linearGradient id="gCoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#464650"/>
      <stop offset="100%" stop-color="#0d0d10"/>
    </linearGradient>
    <linearGradient id="gWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff6d6"/>
      <stop offset="100%" stop-color="#e9b249"/>
    </linearGradient>
    <linearGradient id="gSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c3d0dc"/>
      <stop offset="45%"  stop-color="#7c8a98"/>
      <stop offset="100%" stop-color="#39434d"/>
    </linearGradient>
    <!-- Messing fuer Glocke, Pfeife, Ventile und Schilder -->
    <linearGradient id="gBrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffe9ab"/>
      <stop offset="30%"  stop-color="#e2b64e"/>
      <stop offset="55%"  stop-color="#b98c1e"/>
      <stop offset="100%" stop-color="#6a4c0a"/>
    </linearGradient>
    <linearGradient id="gDoor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2b6349"/>
      <stop offset="35%"  stop-color="#376f52"/>
      <stop offset="100%" stop-color="#14301f"/>
    </linearGradient>
    <!-- Radreifen: oben Mondlicht, unten im Schatten -->
    <linearGradient id="gTyre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#cfdbe6"/>
      <stop offset="40%"  stop-color="#7b8998"/>
      <stop offset="100%" stop-color="#2f3841"/>
    </linearGradient>
    <!-- Legt sich ueber das Rad und gibt ihm Woelbung -->
    <radialGradient id="gWheelShade" cx="36%" cy="28%" r="78%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="52%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".48"/>
    </radialGradient>
    <radialGradient id="gLamp" cx="40%" cy="34%" r="66%">
      <stop offset="0%"   stop-color="#fffdf0"/>
      <stop offset="45%"  stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#cf8c12"/>
    </radialGradient>

    <!-- Weiches Glühen für Lampe und Fenster -->
    <filter id="fGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Treibrad: Speichen, Nabe, Gegengewicht -->
    <g id="wheelBig">
      <circle r="30" fill="#04080c"/>
      <circle r="28" fill="#161e26"/>
      <circle r="28" fill="none" stroke="url(#gTyre)" stroke-width="4.5"/>
      <circle r="22.5" fill="#232d38"/>
      <g stroke="#5b6977" stroke-width="4.4" stroke-linecap="round">
        <line y1="-20.5" y2="20.5"/>
        <line y1="-20.5" y2="20.5" transform="rotate(30)"/>
        <line y1="-20.5" y2="20.5" transform="rotate(60)"/>
        <line y1="-20.5" y2="20.5" transform="rotate(90)"/>
        <line y1="-20.5" y2="20.5" transform="rotate(120)"/>
        <line y1="-20.5" y2="20.5" transform="rotate(150)"/>
      </g>
      <g stroke="#93a5b6" stroke-width="1.3" stroke-linecap="round" opacity=".5"
         transform="translate(-1.1,-1.1)">
        <line y1="-19" y2="19"/>
        <line y1="-19" y2="19" transform="rotate(30)"/>
        <line y1="-19" y2="19" transform="rotate(60)"/>
        <line y1="-19" y2="19" transform="rotate(90)"/>
        <line y1="-19" y2="19" transform="rotate(120)"/>
        <line y1="-19" y2="19" transform="rotate(150)"/>
      </g>
      <path d="M17.6 12.3 A21.5 21.5 0 0 1 -17.6 12.3 L-8.2 5.7 A10 10 0 0 0 8.2 5.7 Z" fill="#3b4653"/>
      <circle r="8.5" fill="#3b4653" stroke="#04080c" stroke-width="2"/>
      <circle cx="-2" cy="-2" r="3.2" fill="#aebcc9" opacity=".8"/>
      <circle r="28" fill="url(#gWheelShade)"/>
    </g>

    <!-- Laufrad -->
    <g id="wheelSmall">
      <circle r="16.5" fill="#04080c"/>
      <circle r="15" fill="#161e26"/>
      <circle r="15" fill="none" stroke="url(#gTyre)" stroke-width="3.4"/>
      <circle r="10.5" fill="#232d38"/>
      <g stroke="#5b6977" stroke-width="3.2" stroke-linecap="round">
        <line y1="-9" y2="9"/>
        <line y1="-9" y2="9" transform="rotate(45)"/>
        <line y1="-9" y2="9" transform="rotate(90)"/>
        <line y1="-9" y2="9" transform="rotate(135)"/>
      </g>
      <circle r="4.4" fill="#3b4653" stroke="#04080c" stroke-width="1.6"/>
      <circle cx="-1.2" cy="-1.2" r="1.6" fill="#aebcc9" opacity=".75"/>
      <circle r="15" fill="url(#gWheelShade)"/>
    </g>
  </defs>
</svg>


<div id="app">

  <!-- #camera bekommt den Screenshake, #world die Parallaxe -->
  <div id="camera">
    <div id="world">

      <div class="layer sky"       data-depth="0"></div>
      <canvas class="layer" id="skyfx" data-depth="2"></canvas>
      <div class="layer moon"      data-depth="3"></div>
      <div class="layer glowband"  data-depth="2"></div>

      <!-- Ferne Bergkette -->
      <svg class="layer ridge ridge-far" data-depth="6" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 300 V190 L74 118 L128 163 L206 84 L272 148 L338 104 L418 172 L498 116
                 L556 168 L640 96 L716 158 L788 126 L860 176 L938 110 L1016 164 L1098 130
                 L1200 172 V300 Z"/>
      </svg>
      <div class="layer haze haze-far" data-depth="7"></div>

      <!-- Mittlere Hügelkette -->
      <svg class="layer ridge ridge-mid" data-depth="11" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 300 V228 Q96 186 196 220 Q296 254 398 208 Q516 158 618 212
                 Q722 262 822 214 Q922 170 1024 218 Q1124 258 1200 222 V300 Z"/>
      </svg>
      <div class="layer haze haze-mid" data-depth="13"></div>

      <!-- Baumsilhouetten, Pfad wird per JS erzeugt -->
      <svg class="layer treeline" data-depth="18" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
        <path id="treePath"/>
      </svg>

      <!-- Telegrafenmasten, per JS erzeugt -->
      <div class="layer poles" data-depth="22" id="poles"></div>

      <div class="layer ground" data-depth="26"></div>

      <!-- Gleis über die ganze Bildbreite -->
      <div class="layer track" data-depth="30">
        <div class="rail far"></div>
        <div class="sleepers"></div>
        <div class="rail near"><i class="shine"></i></div>
      </div>

      <!-- Eigene Ebene mit derselben Tiefe wie das Gleis, damit der Zug
           beim Parallax-Versatz auf der Schiene stehen bleibt. -->
      <div class="layer" id="trainLayer" data-depth="30">
      <div id="trainWrap">
        <!-- Lichtkegel des Spitzenlichts, sitzt vor der Lok -->
        <div id="beam"></div>
        <div id="train">

        <!-- ===================== Dampflokomotive ===================== -->
        <div class="part loco">
          <span class="steam"></span><span class="steam"></span><span class="steam"></span>
          <svg viewBox="0 0 280 150" width="280" height="150" aria-hidden="true">
            <ellipse cx="142" cy="147" rx="132" ry="6" fill="#000" opacity=".38"/>
            <rect x="258" y="86" width="20" height="10" rx="2" fill="#1b232b" stroke="#04080c" stroke-width="3"/>

            <use href="#wheelSmall" x="42" y="133.5"/>
            <use href="#wheelBig" x="112" y="120"/>
            <use href="#wheelBig" x="186" y="120"/>

            <!-- Gleitbahn und Kreuzkopf ueber der Treibstange -->
            <rect x="92" y="116" width="30" height="7" rx="3.5" fill="#04080c"/>
            <rect x="94" y="117.5" width="26" height="4" rx="2" fill="#4d5b69"/>
            <rect x="104" y="114" width="12" height="11" rx="2.5" fill="#04080c"/>
            <rect x="105.5" y="115.5" width="9" height="8" rx="2" fill="url(#gSteel)"/>

            <!-- Treibstange -->
            <rect x="92" y="127" width="96" height="9" rx="4.5" fill="#04080c"/>
            <rect x="94" y="128.5" width="92" height="6" rx="3" fill="url(#gSteel)"/>
            <circle cx="112" cy="132" r="5" fill="#39454f" stroke="#04080c" stroke-width="2"/>
            <circle cx="186" cy="132" r="5" fill="#39454f" stroke="#04080c" stroke-width="2"/>
            <circle cx="110.5" cy="130.5" r="1.6" fill="#a8b6c3" opacity=".7"/>
            <circle cx="184.5" cy="130.5" r="1.6" fill="#a8b6c3" opacity=".7"/>
            <!-- Kolbenstange vom Zylinder zum Kreuzkopf -->
            <rect x="94" y="118" width="14" height="3" rx="1.5" fill="#b3c1cf" opacity=".75"/>

            <!-- Durchgang 1: gemeinsame Silhouette (traegt die Aussenkontur) -->
            <g fill="#04080c" stroke="#04080c" stroke-width="6" stroke-linejoin="round">
              <rect x="18" y="84" width="252" height="13" rx="3"/>
              <rect x="178" y="26" width="82" height="70" rx="5"/>
              <path d="M170 27 Q219 8 268 27 L268 38 Q219 19 170 38 Z"/>
              <rect x="58" y="32" width="124" height="54" rx="10"/>
              <path d="M100 36 L100 25 A17 12 0 0 1 134 25 L134 36 Z"/>
              <path d="M142 36 L142 29 A11 8 0 0 1 164 29 L164 36 Z"/>
              <rect x="22" y="26" width="42" height="64" rx="15"/>
              <path d="M32 32 L35 13 L28 13 L28 2 L66 2 L66 13 L59 13 L62 32 Z"/>
              <rect x="54" y="96" width="42" height="28" rx="6"/>
              <path d="M28 92 L4 140 L30 140 Z"/>
            </g>
            <!-- Durchgang 2: Flaechen, ohne eigene Kontur -->
            <rect x="18" y="84" width="252" height="13" rx="3" fill="url(#gFrame)"/>
            <rect x="178" y="26" width="82" height="70" rx="5" fill="url(#gCab)"/>
            <path d="M170 27 Q219 8 268 27 L268 38 Q219 19 170 38 Z" fill="url(#gRoof)"/>
            <rect x="58" y="32" width="124" height="54" rx="10" fill="url(#gBoiler)"/>
            <path d="M100 36 L100 25 A17 12 0 0 1 134 25 L134 36 Z" fill="url(#gBoiler)"/>
            <path d="M142 36 L142 29 A11 8 0 0 1 164 29 L164 36 Z" fill="url(#gBoiler)"/>
            <rect x="22" y="26" width="42" height="64" rx="15" fill="url(#gSmokebox)"/>
            <path d="M32 32 L35 13 L28 13 L28 2 L66 2 L66 13 L59 13 L62 32 Z" fill="url(#gSmokebox)"/>
            <rect x="54" y="96" width="42" height="28" rx="6" fill="url(#gCylinder)"/>
            <path d="M28 92 L4 140 L30 140 Z" fill="url(#gPilot)"/>

            <!-- ============ Schattierung, Licht von oben links ============ -->
            <rect x="64" y="35.5" width="112" height="6" rx="3" fill="#c3d5e4" opacity=".38"/>
            <rect x="62" y="72" width="118" height="14" rx="7" fill="#000" opacity=".30"/>
            <rect x="22" y="70" width="42" height="20" rx="10" fill="#000" opacity=".26"/>
            <rect x="24" y="84" width="240" height="5" fill="#000" opacity=".38"/>
            <path d="M172 30 Q219 12 266 30 L266 34 Q219 16 172 34 Z" fill="#000" opacity=".22"/>
            <path d="M68 32.6 L172 32.6" stroke="#b9cddd" stroke-width="1.5" opacity=".45" stroke-linecap="round"/>

            <!-- Kesselringe mit Nietenreihen beidseitig -->
            <g stroke="#c79a2a" stroke-width="3.4" opacity=".62">
              <line x1="90" y1="33" x2="90" y2="85"/>
              <line x1="138" y1="33" x2="138" y2="85"/>
              <line x1="170" y1="33" x2="170" y2="85"/>
            </g>
            <g stroke="#ffe6a0" stroke-width="1" opacity=".5">
              <line x1="88.6" y1="36" x2="88.6" y2="70"/>
              <line x1="136.6" y1="36" x2="136.6" y2="70"/>
              <line x1="168.6" y1="36" x2="168.6" y2="70"/>
            </g>
            <g fill="#9db0c1" opacity=".3"><circle cx="85" cy="40.0" r="0.95"/><circle cx="85" cy="48.0" r="0.95"/><circle cx="85" cy="56.0" r="0.95"/><circle cx="85" cy="64.0" r="0.95"/><circle cx="85" cy="72.0" r="0.95"/><circle cx="85" cy="80.0" r="0.95"/></g>
            <g fill="#9db0c1" opacity=".3"><circle cx="95" cy="40.0" r="0.95"/><circle cx="95" cy="48.0" r="0.95"/><circle cx="95" cy="56.0" r="0.95"/><circle cx="95" cy="64.0" r="0.95"/><circle cx="95" cy="72.0" r="0.95"/><circle cx="95" cy="80.0" r="0.95"/></g>
            <g fill="#9db0c1" opacity=".3"><circle cx="133" cy="40.0" r="0.95"/><circle cx="133" cy="48.0" r="0.95"/><circle cx="133" cy="56.0" r="0.95"/><circle cx="133" cy="64.0" r="0.95"/><circle cx="133" cy="72.0" r="0.95"/><circle cx="133" cy="80.0" r="0.95"/></g>
            <g fill="#9db0c1" opacity=".3"><circle cx="143" cy="40.0" r="0.95"/><circle cx="143" cy="48.0" r="0.95"/><circle cx="143" cy="56.0" r="0.95"/><circle cx="143" cy="64.0" r="0.95"/><circle cx="143" cy="72.0" r="0.95"/><circle cx="143" cy="80.0" r="0.95"/></g>
            <g fill="#9db0c1" opacity=".3"><circle cx="165" cy="40.0" r="0.95"/><circle cx="165" cy="48.0" r="0.95"/><circle cx="165" cy="56.0" r="0.95"/><circle cx="165" cy="64.0" r="0.95"/><circle cx="165" cy="72.0" r="0.95"/><circle cx="165" cy="80.0" r="0.95"/></g>
            <g fill="#9db0c1" opacity=".3"><circle cx="175" cy="40.0" r="0.95"/><circle cx="175" cy="48.0" r="0.95"/><circle cx="175" cy="56.0" r="0.95"/><circle cx="175" cy="64.0" r="0.95"/><circle cx="175" cy="72.0" r="0.95"/><circle cx="175" cy="80.0" r="0.95"/></g>

            <!-- Handlauf -->
            <g opacity=".34">
              <line x1="68" y1="47" x2="176" y2="47" stroke="#bccadb" stroke-width="1.4" stroke-linecap="round"/>
              <line x1="76" y1="47" x2="76" y2="52" stroke="#7d8b99" stroke-width="1.4"/>
              <line x1="118" y1="47" x2="118" y2="52" stroke="#7d8b99" stroke-width="1.4"/>
              <line x1="160" y1="47" x2="160" y2="52" stroke="#7d8b99" stroke-width="1.4"/>
            </g>

            <!-- Speiseleitung am unteren Kesselrand -->
            <path d="M68 79 L172 79" stroke="#04080c" stroke-width="5" stroke-linecap="round"/>
            <path d="M68 79 L172 79" stroke="#4a5866" stroke-width="2.6" stroke-linecap="round"/>
            <g stroke="#39434e" stroke-width="2" opacity=".8">
              <line x1="86" y1="76" x2="86" y2="82"/>
              <line x1="128" y1="76" x2="128" y2="82"/>
              <line x1="160" y1="76" x2="160" y2="82"/>
            </g>

            <g fill="#9db0c1" opacity=".42"><circle cx="66.0" cy="33.5" r="1.15"/><circle cx="75.3" cy="33.5" r="1.15"/><circle cx="84.7" cy="33.5" r="1.15"/><circle cx="94.0" cy="33.5" r="1.15"/><circle cx="103.3" cy="33.5" r="1.15"/><circle cx="112.7" cy="33.5" r="1.15"/><circle cx="122.0" cy="33.5" r="1.15"/><circle cx="131.3" cy="33.5" r="1.15"/><circle cx="140.7" cy="33.5" r="1.15"/><circle cx="150.0" cy="33.5" r="1.15"/><circle cx="159.3" cy="33.5" r="1.15"/><circle cx="168.7" cy="33.5" r="1.15"/><circle cx="178.0" cy="33.5" r="1.15"/></g>
            <g fill="#9db0c1" opacity=".42"><circle cx="66.0" cy="84.5" r="1.15"/><circle cx="75.3" cy="84.5" r="1.15"/><circle cx="84.7" cy="84.5" r="1.15"/><circle cx="94.0" cy="84.5" r="1.15"/><circle cx="103.3" cy="84.5" r="1.15"/><circle cx="112.7" cy="84.5" r="1.15"/><circle cx="122.0" cy="84.5" r="1.15"/><circle cx="131.3" cy="84.5" r="1.15"/><circle cx="140.7" cy="84.5" r="1.15"/><circle cx="150.0" cy="84.5" r="1.15"/><circle cx="159.3" cy="84.5" r="1.15"/><circle cx="168.7" cy="84.5" r="1.15"/><circle cx="178.0" cy="84.5" r="1.15"/></g>
            <g fill="#9db0c1" opacity=".42"><circle cx="26.5" cy="32.0" r="1.15"/><circle cx="26.5" cy="41.3" r="1.15"/><circle cx="26.5" cy="50.7" r="1.15"/><circle cx="26.5" cy="60.0" r="1.15"/><circle cx="26.5" cy="69.3" r="1.15"/><circle cx="26.5" cy="78.7" r="1.15"/><circle cx="26.5" cy="88.0" r="1.15"/></g>
            <g fill="#9db0c1" opacity=".42"><circle cx="256.5" cy="30.0" r="1.15"/><circle cx="256.5" cy="38.9" r="1.15"/><circle cx="256.5" cy="47.7" r="1.15"/><circle cx="256.5" cy="56.6" r="1.15"/><circle cx="256.5" cy="65.4" r="1.15"/><circle cx="256.5" cy="74.3" r="1.15"/><circle cx="256.5" cy="83.1" r="1.15"/><circle cx="256.5" cy="92.0" r="1.15"/></g>
            <g fill="#9db0c1" opacity=".42"><circle cx="184.0" cy="29.5" r="1.15"/><circle cx="194.0" cy="29.5" r="1.15"/><circle cx="204.0" cy="29.5" r="1.15"/><circle cx="214.0" cy="29.5" r="1.15"/><circle cx="224.0" cy="29.5" r="1.15"/><circle cx="234.0" cy="29.5" r="1.15"/><circle cx="244.0" cy="29.5" r="1.15"/><circle cx="254.0" cy="29.5" r="1.15"/></g>
            <g fill="#9db0c1" opacity=".3"><circle cx="30" cy="88.0" r="1"/><circle cx="30" cy="94.0" r="1"/></g>

            <!-- ==================== Anbauteile ==================== -->
            <!-- Sicherheitsventile auf dem Dampfdom -->
            <g stroke="#04080c" stroke-width="4.5" stroke-linecap="round">
              <line x1="110" y1="26" x2="110" y2="20"/><line x1="122" y1="26" x2="122" y2="19"/>
            </g>
            <g stroke="#c79a2a" stroke-width="2.4" stroke-linecap="round">
              <line x1="110" y1="26" x2="110" y2="20"/><line x1="122" y1="26" x2="122" y2="19"/>

    <section class="panel" id="panel-keys" role="dialog" aria-modal="true" aria-labelledby="h-keys" hidden>
      <h2 id="h-keys">Steuerung</h2>
      <dl class="keys">
        <dt><kbd>&uarr;</kbd><kbd>&darr;</kbd></dt><dd>Menüpunkt wählen</dd>
        <dt><kbd>Enter</kbd></dt><dd>Bestätigen</dd>
        <dt><kbd>Esc</kbd></dt><dd>Zurück / Schließen</dd>
        <dt><kbd>R</kbd></dt><dd>Szene zurücksetzen</dd>
      </dl>
      <button class="btn small" data-close><span class="lbl">Zurück</span></button>
    </section>

  </div>
</div>
