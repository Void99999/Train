<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LAST TRAIN</title>
    <meta name="description" content="LAST TRAIN - a first-person survival train game." />
    <link rel="stylesheet" href="src/ui/styles.css" />
    <!-- Inline so the page never makes a network request for a 16-pixel icon. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0c0d'/%3E%3Crect x='2' y='5' width='12' height='6' fill='%233f5240'/%3E%3Crect x='2' y='12' width='12' height='1' fill='%236d787d'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!--
      The whole interface is built by src/ui at runtime, so that no user-facing
      string is ever written into markup where the localization system cannot
      reach it. This file only provides the surfaces to draw on.
    -->
    <div id="app">
      <canvas id="scene" aria-hidden="true"></canvas>
      <div id="overlay"></div>
      <div id="hud" hidden></div>
    </div>

    <noscript>
      <p class="fallback">LAST TRAIN needs JavaScript to run.</p>
    </noscript>

    <div id="boot-error" hidden></div>

    <script type="module">
      import { boot } from "./src/main.js";

      boot().catch((error) => {
        console.error(error);
        const box = document.getElementById("boot-error");
        box.hidden = false;
        box.textContent =
          `LAST TRAIN could not start: ${error.message}\n\n` +
          "If the page was opened directly from disk, serve the folder instead: npm start";
      });
    </script>
  </body>
</html>
