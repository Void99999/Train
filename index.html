<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAIL BLAST</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===================================================================
     Wiederverwendbare Bauteile und Farbverläufe der Zug-Illustration.
     Liegt einmal im Dokument, alle Fahrzeuge referenzieren es per <use>.
     =================================================================== -->
<svg id="artdefs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <!-- ===== Materialien =====
         Schwarzer Kessel, rotes Fahrwerk. Statt eines flachen Verlaufs
         bekommt jede Flaeche zusaetzlich eine Himmels- und eine
         Bodenreflexion (mSkyRefl / mWarmRefl) daruebergelegt. -->

    <linearGradient id="mBoiler" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1116"/>
      <stop offset="14%"  stop-color="#38434f"/>
      <stop offset="26%"  stop-color="#5a6875"/>
      <stop offset="38%"  stop-color="#2f3841"/>
      <stop offset="66%"  stop-color="#171d24"/>
      <stop offset="88%"  stop-color="#22292f"/>
      <stop offset="100%" stop-color="#080b0f"/>
    </linearGradient>
    <linearGradient id="mSmoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0b0f13"/>
      <stop offset="22%"  stop-color="#2c353f"/>
      <stop offset="40%"  stop-color="#404b57"/>
      <stop offset="70%"  stop-color="#151b21"/>
      <stop offset="100%" stop-color="#070a0d"/>
    </linearGradient>
    <linearGradient id="mDeflector" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6b7b8b"/>
      <stop offset="22%"  stop-color="#44515e"/>
      <stop offset="60%"  stop-color="#232b33"/>
      <stop offset="100%" stop-color="#0d1217"/>
    </linearGradient>
    <linearGradient id="mCab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#101419"/>
      <stop offset="20%"  stop-color="#2e3740"/>
      <stop offset="40%"  stop-color="#1c232a"/>
      <stop offset="100%" stop-color="#070a0d"/>
    </linearGradient>
    <linearGradient id="mRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#39434e"/>
      <stop offset="60%"  stop-color="#191f25"/>
      <stop offset="100%" stop-color="#0a0d11"/>
    </linearGradient>
    <linearGradient id="mRoof2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8d9aa6"/>
      <stop offset="45%"  stop-color="#5d6874"/>
      <stop offset="100%" stop-color="#2e353d"/>
    </linearGradient>
    <!-- Rotes Fahrwerk: der Farbakzent der Maschine -->
    <linearGradient id="mRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c23a30"/>
      <stop offset="26%"  stop-color="#8f2320"/>
      <stop offset="62%"  stop-color="#5d1414"/>
      <stop offset="100%" stop-color="#280808"/>
    </linearGradient>
    <linearGradient id="mFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#4a5561"/>
      <stop offset="35%"  stop-color="#252d35"/>
      <stop offset="100%" stop-color="#0c1015"/>
    </linearGradient>
    <linearGradient id="mCyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#48535f"/>
      <stop offset="34%"  stop-color="#2a323b"/>
      <stop offset="100%" stop-color="#0d1116"/>
    </linearGradient>
    <linearGradient id="mCoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#464650"/>
      <stop offset="100%" stop-color="#0c0c0f"/>
    </linearGradient>
    <!-- Wagen: weinrot unten, cremefarbenes Fensterband -->
    <linearGradient id="mCoachLo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#7e2724"/>
      <stop offset="26%"  stop-color="#6a1f1d"/>
      <stop offset="62%"  stop-color="#4a1413"/>
      <stop offset="100%" stop-color="#1e0808"/>
    </linearGradient>
    <linearGradient id="mCream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#efe0c0"/>
      <stop offset="40%"  stop-color="#d6c19a"/>
      <stop offset="100%" stop-color="#9c8763"/>
    </linearGradient>
    <linearGradient id="mSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ccd9e5"/>
      <stop offset="45%"  stop-color="#7c8a98"/>
      <stop offset="100%" stop-color="#333c45"/>
    </linearGradient>
    <linearGradient id="mBrass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffe9ab"/>
      <stop offset="30%"  stop-color="#e2b64e"/>
      <stop offset="55%"  stop-color="#b98c1e"/>
      <stop offset="100%" stop-color="#6a4c0a"/>
    </linearGradient>
    <linearGradient id="mWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff6d6"/>
      <stop offset="100%" stop-color="#e9b249"/>
    </linearGradient>
    <radialGradient id="mDoor" cx="36%" cy="30%" r="76%">
      <stop offset="0%"   stop-color="#5a6673" stop-opacity=".5"/>
      <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".55"/>
    </radialGradient>
    <radialGradient id="mLamp" cx="40%" cy="34%" r="66%">
      <stop offset="0%"   stop-color="#fffdf0"/>
      <stop offset="45%"  stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#cf8c12"/>
    </radialGradient>

    <!-- Umgebungsreflexionen: kuehler Himmel oben, warmes Bodenlicht unten -->
    <linearGradient id="mSkyRefl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9fc4e8" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#9fc4e8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mWarmRefl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffa347" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffa347" stop-opacity=".26"/>
    </linearGradient>

    <!-- Der helle Horizont spiegelt sich als schmales Band im Kessel -->
    <linearGradient id="mHorizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffd9a0" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#ffd9a0" stop-opacity=".1"/>
      <stop offset="52%"  stop-color="#fff0d0" stop-opacity=".15"/>
      <stop offset="84%"  stop-color="#ffd9a0" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/>
    </linearGradient>
    <!-- Weiche Russ- und Schmutzflecken; echte Maschinen sind nicht makellos -->
    <radialGradient id="mSoot" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#05070a" stop-opacity=".5"/>
      <stop offset="60%"  stop-color="#05070a" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#05070a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mRust" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#7a4520" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#7a4520" stop-opacity="0"/>
    </radialGradient>
    <!-- Licht, das vom Boden zurueck auf die Unterseite faellt -->
    <linearGradient id="mBounce" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#ff9c42" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#ff9c42" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mTyre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#d5e1ec"/>
      <stop offset="40%"  stop-color="#7b8998"/>
      <stop offset="100%" stop-color="#2b333c"/>
    </linearGradient>
    <radialGradient id="mWheelShade" cx="36%" cy="28%" r="78%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="52%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".5"/>
    </radialGradient>

    <!-- Weiche Verschattung; ersetzt harte Schattenkanten -->
    <filter id="fSoft" x="-40%" y="-300%" width="180%" height="700%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="fGlow" x="-260%" y="-260%" width="620%" height="620%">
      <feGaussianBlur stdDeviation="4" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/><feMergeNode in="b2"/>
        <feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Treibrad: roter Radstern, blanker Radreifen -->
    <g id="wheelDrive">
      <circle r="34" fill="#03060a"/>
      <circle r="32" fill="#1a1f26"/>
      <circle r="32" fill="none" stroke="url(#mTyre)" stroke-width="5"/>
      <circle r="26" fill="#7d1f1c"/>
      <g stroke="#a83029" stroke-width="5" stroke-linecap="round">
        <line y1="-24" y2="24"/>
        <line y1="-24" y2="24" transform="rotate(30)"/>
        <line y1="-24" y2="24" transform="rotate(60)"/>
        <line y1="-24" y2="24" transform="rotate(90)"/>
        <line y1="-24" y2="24" transform="rotate(120)"/>
        <line y1="-24" y2="24" transform="rotate(150)"/>
      </g>
      <g stroke="#d4685c" stroke-width="1.4" stroke-linecap="round" opacity=".45"
         transform="translate(-1.2,-1.2)">
        <line y1="-22" y2="22"/>
        <line y1="-22" y2="22" transform="rotate(30)"/>
        <line y1="-22" y2="22" transform="rotate(60)"/>
        <line y1="-22" y2="22" transform="rotate(90)"/>
        <line y1="-22" y2="22" transform="rotate(120)"/>
        <line y1="-22" y2="22" transform="rotate(150)"/>
      </g>
      <path d="M20 14 A24.5 24.5 0 0 1 -20 14 L-9 6.5 A11.5 11.5 0 0 0 9 6.5 Z" fill="#5e1613"/>
      <circle r="9.5" fill="#39434e" stroke="#03060a" stroke-width="2"/>
      <circle cx="-2.4" cy="-2.4" r="3.4" fill="#b6c4d1" opacity=".75"/>
      <circle r="32" fill="url(#mWheelShade)"/>
    </g>

    <!-- Laufrad -->
    <g id="wheelSmall">
      <circle r="18" fill="#03060a"/>
      <circle r="16.2" fill="#1a1f26"/>
      <circle r="16.2" fill="none" stroke="url(#mTyre)" stroke-width="4"/>
      <circle r="11.6" fill="#7d1f1c"/>
      <g stroke="#a83029" stroke-width="3.4" stroke-linecap="round">
        <line y1="-10" y2="10"/>
        <line y1="-10" y2="10" transform="rotate(45)"/>
        <line y1="-10" y2="10" transform="rotate(90)"/>
        <line y1="-10" y2="10" transform="rotate(135)"/>
      </g>
      <circle r="4.8" fill="#39434e" stroke="#03060a" stroke-width="1.6"/>
      <circle cx="-1.4" cy="-1.4" r="1.8" fill="#b6c4d1" opacity=".7"/>
      <circle r="16.2" fill="url(#mWheelShade)"/>
    </g>
    </defs>
</svg>


<div id="app">

  <!-- ============== Egoperspektive: Schlachtfeld ==============
       Dritter Akt. Der Hintergrund liegt vor der Kamera-Ebene, damit
       Feuer und Leuchtspuren vom Partikel-Canvas darueber gezeichnet
       werden; die Haende kommen danach noch einmal obendrauf. -->
  <div id="fpsBack" class="fpsLayer" aria-hidden="true">
    <div class="fps-scene">
      <svg class="fps-back" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMax slice">
        <defs>
          <linearGradient id="fSky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#0a0805"/>
            <stop offset="38%"  stop-color="#2a1409"/>
            <stop offset="66%"  stop-color="#6b2c0c"/>
            <stop offset="88%"  stop-color="#b8540f"/>
            <stop offset="100%" stop-color="#5d2a0b"/>
          </linearGradient>
          <linearGradient id="fGround" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#3a2412"/>
            <stop offset="26%"  stop-color="#241708"/>
            <stop offset="100%" stop-color="#0b0704"/>
          </linearGradient>
          <radialGradient id="fGlow" cx="50%" cy="100%" r="70%">
            <stop offset="0%"   stop-color="#ff8a26" stop-opacity=".55"/>
            <stop offset="100%" stop-color="#ff8a26" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <rect width="1200" height="410" fill="url(#fSky)"/>
        <rect y="150" width="1200" height="260" fill="url(#fGlow)"/>
        <g><path d="M20 400 L24 345 L36 358 L32 400 Z" fill="#0b0906"/><path d="M77 400 L80 358 L94 366 L91 400 Z" fill="#0b0906"/><path d="M120 400 L117 347 L126 357 L128 400 Z" fill="#0b0906"/><path d="M200 400 L195 340 L207 344 L212 400 Z" fill="#0b0906"/><path d="M291 400 L288 367 L303 372 L306 400 Z" fill="#0b0906"/><path d="M356 400 L347 317 L357 330 L366 400 Z" fill="#0b0906"/><path d="M430 400 L423 345 L438 354 L445 400 Z" fill="#0b0906"/><path d="M468 400 L476 362 L491 368 L483 400 Z" fill="#0b0906"/><path d="M554 400 L556 365 L566 373 L564 400 Z" fill="#0b0906"/><path d="M624 400 L628 361 L635 372 L631 400 Z" fill="#0b0906"/><path d="M714 400 L716 366 L726 374 L724 400 Z" fill="#0b0906"/><path d="M792 400 L801 348 L810 357 L801 400 Z" fill="#0b0906"/><path d="M864 400 L859 312 L873 320 L878 400 Z" fill="#0b0906"/><path d="M899 400 L895 309 L909 314 L914 400 Z" fill="#0b0906"/><path d="M978 400 L982 321 L994 332 L990 400 Z" fill="#0b0906"/><path d="M1056 400 L1062 324 L1070 333 L1064 400 Z" fill="#0b0906"/><path d="M1104 400 L1105 360 L1118 373 L1117 400 Z" fill="#0b0906"/><path d="M1155 400 L1157 306 L1169 318 L1167 400 Z" fill="#0b0906"/></g>
        <rect y="398" width="1200" height="222" fill="url(#fGround)"/>
        <g><ellipse cx="278" cy="535" rx="16.5" ry="2.2" fill="#241d14" opacity="0.96"/><ellipse cx="99" cy="486" rx="4.4" ry="3.8" fill="#241d14" opacity="0.98"/><ellipse cx="1103" cy="488" rx="7.3" ry="2.9" fill="#241d14" opacity="0.59"/><ellipse cx="209" cy="468" rx="9.0" ry="7.1" fill="#16130f" opacity="0.89"/><ellipse cx="262" cy="435" rx="15.8" ry="7.8" fill="#1d1a13" opacity="0.56"/><ellipse cx="968" cy="440" rx="9.0" ry="4.8" fill="#120f0b" opacity="0.77"/><ellipse cx="1113" cy="441" rx="18.7" ry="2.6" fill="#1d1a13" opacity="0.61"/><ellipse cx="650" cy="435" rx="10.5" ry="7.8" fill="#241d14" opacity="0.60"/><ellipse cx="748" cy="459" rx="13.5" ry="5.7" fill="#241d14" opacity="0.78"/><ellipse cx="641" cy="539" rx="16.9" ry="5.6" fill="#241d14" opacity="0.70"/><ellipse cx="785" cy="568" rx="21.2" ry="7.5" fill="#120f0b" opacity="0.99"/><ellipse cx="573" cy="569" rx="13.1" ry="2.5" fill="#120f0b" opacity="0.51"/><ellipse cx="537" cy="422" rx="8.5" ry="2.3" fill="#1d1a13" opacity="0.75"/><ellipse cx="326" cy="560" rx="9.8" ry="5.7" fill="#241d14" opacity="0.52"/><ellipse cx="554" cy="426" rx="14.0" ry="5.6" fill="#241d14" opacity="0.73"/><ellipse cx="446" cy="545" rx="7.1" ry="6.1" fill="#1d1a13" opacity="0.97"/><ellipse cx="504" cy="521" rx="11.7" ry="6.1" fill="#16130f" opacity="0.78"/><ellipse cx="179" cy="521" rx="13.2" ry="6.1" fill="#241d14" opacity="0.89"/><ellipse cx="166" cy="555" rx="17.7" ry="4.7" fill="#120f0b" opacity="0.96"/><ellipse cx="453" cy="434" rx="9.4" ry="7.6" fill="#120f0b" opacity="0.68"/><ellipse cx="764" cy="490" rx="5.1" ry="5.9" fill="#241d14" opacity="0.64"/><ellipse cx="1181" cy="526" rx="20.6" ry="7.7" fill="#120f0b" opacity="0.56"/><ellipse cx="955" cy="544" rx="14.9" ry="2.9" fill="#16130f" opacity="0.70"/><ellipse cx="690" cy="560" rx="9.6" ry="6.4" fill="#16130f" opacity="0.54"/><ellipse cx="819" cy="568" rx="4.4" ry="4.9" fill="#1d1a13" opacity="0.83"/><ellipse cx="1054" cy="429" rx="21.4" ry="6.7" fill="#120f0b" opacity="0.68"/><ellipse cx="335" cy="454" rx="17.1" ry="3.0" fill="#1d1a13" opacity="0.56"/><ellipse cx="872" cy="432" rx="9.3" ry="6.3" fill="#241d14" opacity="0.90"/><ellipse cx="245" cy="555" rx="12.0" ry="5.2" fill="#1d1a13" opacity="0.56"/><ellipse cx="897" cy="599" rx="10.8" ry="3.1" fill="#1d1a13" opacity="0.65"/><ellipse cx="1133" cy="503" rx="21.1" ry="2.6" fill="#120f0b" opacity="0.72"/><ellipse cx="234" cy="454" rx="12.8" ry="7.7" fill="#241d14" opacity="0.54"/><ellipse cx="339" cy="489" rx="21.8" ry="3.1" fill="#241d14" opacity="0.94"/><ellipse cx="169" cy="432" rx="14.6" ry="2.9" fill="#120f0b" opacity="0.75"/><ellipse cx="1120" cy="447" rx="17.0" ry="7.9" fill="#120f0b" opacity="0.79"/><ellipse cx="900" cy="415" rx="19.2" ry="7.5" fill="#120f0b" opacity="0.61"/><ellipse cx="527" cy="487" rx="17.1" ry="4.2" fill="#120f0b" opacity="0.58"/><ellipse cx="866" cy="572" rx="21.4" ry="2.7" fill="#120f0b" opacity="0.80"/><ellipse cx="955" cy="475" rx="6.6" ry="3.0" fill="#16130f" opacity="0.61"/><ellipse cx="25" cy="491" rx="20.0" ry="2.8" fill="#16130f" opacity="0.53"/><ellipse cx="1072" cy="485" rx="7.5" ry="5.0" fill="#1d1a13" opacity="0.83"/><ellipse cx="1111" cy="524" rx="7.6" ry="4.4" fill="#16130f" opacity="0.89"/><ellipse cx="947" cy="538" rx="20.0" ry="7.0" fill="#120f0b" opacity="0.93"/><ellipse cx="614" cy="596" rx="7.6" ry="5.3" fill="#241d14" opacity="0.88"/><ellipse cx="700" cy="588" rx="17.7" ry="6.0" fill="#241d14" opacity="0.99"/><ellipse cx="216" cy="571" rx="14.6" ry="2.9" fill="#120f0b" opacity="0.77"/><ellipse cx="185" cy="577" rx="19.5" ry="2.5" fill="#241d14" opacity="0.80"/><ellipse cx="701" cy="483" rx="13.6" ry="6.1" fill="#241d14" opacity="0.65"/><ellipse cx="234" cy="474" rx="7.1" ry="7.1" fill="#1d1a13" opacity="0.87"/><ellipse cx="899" cy="440" rx="10.6" ry="6.2" fill="#1d1a13" opacity="0.56"/><ellipse cx="774" cy="442" rx="10.0" ry="3.8" fill="#241d14" opacity="0.85"/><ellipse cx="596" cy="434" rx="4.4" ry="3.9" fill="#16130f" opacity="0.87"/><ellipse cx="501" cy="581" rx="11.7" ry="6.7" fill="#1d1a13" opacity="0.64"/><ellipse cx="283" cy="458" rx="12.6" ry="4.6" fill="#120f0b" opacity="0.83"/><ellipse cx="149" cy="435" rx="7.9" ry="2.6" fill="#120f0b" opacity="0.58"/><ellipse cx="1051" cy="456" rx="15.0" ry="3.7" fill="#16130f" opacity="0.55"/><ellipse cx="852" cy="499" rx="10.1" ry="4.6" fill="#1d1a13" opacity="0.96"/><ellipse cx="684" cy="427" rx="15.9" ry="2.3" fill="#241d14" opacity="0.85"/><ellipse cx="650" cy="466" rx="19.0" ry="4.2" fill="#16130f" opacity="0.93"/><ellipse cx="1173" cy="415" rx="11.8" ry="6.8" fill="#241d14" opacity="0.56"/><ellipse cx="726" cy="459" rx="17.9" ry="5.5" fill="#241d14" opacity="0.92"/><ellipse cx="348" cy="418" rx="5.3" ry="6.3" fill="#120f0b" opacity="0.92"/><ellipse cx="1032" cy="572" rx="7.5" ry="7.2" fill="#16130f" opacity="0.72"/><ellipse cx="1176" cy="575" rx="8.3" ry="6.3" fill="#16130f" opacity="0.76"/><ellipse cx="411" cy="410" rx="18.6" ry="5.8" fill="#1d1a13" opacity="0.57"/><ellipse cx="310" cy="512" rx="15.8" ry="2.9" fill="#120f0b" opacity="0.72"/><ellipse cx="671" cy="526" rx="13.1" ry="4.2" fill="#1d1a13" opacity="0.89"/><ellipse cx="1138" cy="584" rx="20.9" ry="4.2" fill="#16130f" opacity="0.57"/><ellipse cx="1177" cy="540" rx="6.7" ry="3.3" fill="#120f0b" opacity="0.56"/><ellipse cx="410" cy="429" rx="20.7" ry="6.0" fill="#120f0b" opacity="0.51"/></g>
        <!-- Krater und Furchen im Boden -->
        <ellipse cx="300" cy="470" rx="180" ry="30" fill="#0a0705" opacity=".55"/>
        <ellipse cx="860" cy="510" rx="220" ry="36" fill="#0a0705" opacity=".5"/>
      </svg>

      <!-- Feuerherde; die Flammen zeichnet das Skript als Partikel -->
      <div class="fire-marks">
        <i style="left:12%;bottom:33%"></i><i style="left:31%;bottom:31%"></i>
        <i style="left:52%;bottom:34%"></i><i style="left:71%;bottom:30%"></i>
        <i style="left:88%;bottom:33%"></i>
      </div>
    </div>
  </div>

  <!-- #camera bekommt den Screenshake, #world die Parallaxe -->
  <div id="camera">
    <div id="world">

      <div class="layer sky"       data-depth="0"></div>
      <canvas class="layer" id="skyfx" data-depth="2"></canvas>
      <div class="layer moon"      data-depth="3"></div>
      <div class="layer glowband"  data-depth="2"></div>

        <path d="M52 200 Q46 150 74 132 L176 122 Q212 130 212 178 Z" fill="#ff8a26" opacity=".26"/>
        <path d="M66 140 Q60 96 80 88 Q98 84 102 120" fill="none" stroke="#ffb066" stroke-width="4" opacity=".4"/>
        <path d="M104 130 Q100 80 122 74 Q142 72 144 112" fill="none" stroke="#ffb066" stroke-width="4" opacity=".35"/>
      </svg>

      <div class="fps-vignette"></div>
    </div>
  </div>

  <!-- Kinobalken der Cutscene -->
  <div id="bars" aria-hidden="true"><i class="top"></i><i class="bottom"></i></div>
  <p id="skip" hidden>Leertaste oder Esc zum Überspringen</p>

  <!-- Bildlook: Filmkorn, Randabdunklung, Blitz -->
  <div id="grain"></div>
  <div id="vignette"></div>
  <div id="flash"></div>
  <!-- Schwarzblende zwischen Zugexplosion und Cutscene -->
  <div id="fade"></div>

  <!-- =========================== Menü =========================== -->
  <div id="ui">
    <header class="brand">
      <!-- Spieltitel: hier ändern, wenn dein Spiel anders heißt -->
      <h1 class="title"><span class="t1">RAIL</span><span class="t2">BLAST</span></h1>
      <p class="tagline">Ein Zug. Ein Knopf. Keine Rückfahrkarte.</p>
    </header>

    <nav class="menu" id="menu" aria-label="Hauptmenü">
      <button class="btn primary" id="startBtn" data-action="start"><span class="lbl">Start</span></button>
      <button class="btn" data-action="panel" data-panel="options"><span class="lbl">Optionen</span></button>
      <button class="btn" data-action="panel" data-panel="keys"><span class="lbl">Steuerung</span></button>
    </nav>

    <p class="hint" id="hint">Pfeiltasten zum Wählen, Enter zum Bestätigen.</p>
    <p class="version">v1.0</p>
  </div>

  <!-- ========================== Panels ========================== -->
  <div class="scrim" id="scrim" hidden>

    <section class="panel" id="panel-options" role="dialog" aria-modal="true" aria-labelledby="h-options" hidden>
      <h2 id="h-options">Optionen</h2>

      <div class="row">
        <label for="optVolume">Lautstärke</label>
        <input type="range" id="optVolume" min="0" max="100" step="5" value="80">
        <output id="outVolume">80</output>
      </div>

      <div class="row">
        <label for="optShake">Bildschirmwackeln</label>
        <input type="checkbox" id="optShake" checked>
      </div>

      <div class="row">
        <label for="optQuality">Effektstärke</label>
        <select id="optQuality">
          <option value="0.5">Niedrig</option>
          <option value="1" selected>Mittel</option>
          <option value="1.7">Hoch</option>
        </select>
      </div>

      <button class="btn small" data-close><span class="lbl">Zurück</span></button>
    </section>

    <section class="panel" id="panel-keys" role="dialog" aria-modal="true" aria-labelledby="h-keys" hidden>
      <h2 id="h-keys">Steuerung</h2>
      <dl class="keys">
        <dt><kbd>&uarr;</kbd><kbd>&darr;</kbd></dt><dd>Menüpunkt wählen</dd>
        <dt><kbd>Enter</kbd></dt><dd>Bestätigen</dd>
        <dt><kbd>Esc</kbd></dt><dd>Zurück / Schließen</dd>
        <dt><kbd>R</kbd></dt><dd>Szene zurücksetzen</dd>
      </dl>
      <button class="btn small" data-close><span class="lbl">Zurück</span></button>
    </section>

  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
